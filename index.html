<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ascensão/MGM — Board Academy</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --gold:#B8860B; --gold-bg:#FFF9E6;
    --navy:#1A1A2E; --bg:#F4F5F7; --white:#fff;
    --text:#1E1E2E; --muted:#6B7280; --border:#E2E4E9;
    --green:#0D7A3E; --green-bg:#F2F9F5; --green-hd:#EAF4EE;
    --red:#B91C1C; --red-bg:#FEF2F2;
    --amber:#92400E; --amber-bg:#FFFBEB;
    --blue-bg:#F4F7FE;
    --shadow:0 1px 3px rgba(0,0,0,.08);
  }
  body{background:var(--bg);color:var(--text);font-size:13px;
       font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}

  /* HEADER */
  .header{background:var(--navy);height:56px;padding:0 24px;display:flex;
          align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;
          box-shadow:0 4px 6px rgba(0,0,0,.07);flex-wrap:wrap}
  .header-left{display:flex;align-items:center;gap:22px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand-bar{width:3px;height:22px;background:var(--gold);border-radius:2px}
  .brand-text{color:#fff;font-size:14px;font-weight:700;letter-spacing:.5px}
  .brand-sub{color:var(--gold);font-size:10px;letter-spacing:1.5px;font-weight:600;text-transform:uppercase}
  .periodo-badge{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
                 border-radius:6px;padding:4px 12px;color:rgba(255,255,255,.75);font-size:12px}
  .periodo-badge strong{color:var(--gold)}
  .header-right{display:flex;align-items:center;gap:10px}
  .header-right select{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);
                       border-radius:5px;color:#fff;font-size:12px;padding:5px 10px;cursor:pointer;outline:none}
  .header-right select option{background:#1A1A2E;color:#fff}
  .update-info{color:rgba(255,255,255,.45);font-size:11px}
  .btn-reload{background:transparent;border:1px solid rgba(255,255,255,.2);border-radius:5px;
              color:rgba(255,255,255,.6);font-size:11px;padding:5px 12px;cursor:pointer;transition:all .2s}
  .btn-reload:hover{border-color:var(--gold);color:var(--gold)}

  .main{padding:22px 24px;max-width:1180px;margin:0 auto}

  .block-title{font-size:11px;font-weight:700;color:var(--gold);letter-spacing:1px;
               text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .block-title::before{content:'';width:3px;height:12px;background:var(--gold);border-radius:2px}
  .block-title .rule{flex:1;height:1px;background:var(--border)}

  .card{background:var(--white);border:1px solid var(--border);border-radius:8px;
        box-shadow:var(--shadow);overflow:hidden;margin-bottom:26px}
  .table-scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}

  /* TABELA PRINCIPAL (métrica x valor) */
  .kpi thead th{background:#F7F8FA;color:var(--muted);font-size:10px;font-weight:700;
                letter-spacing:1px;text-transform:uppercase;padding:11px 16px;text-align:left;
                border-bottom:1px solid var(--border);white-space:nowrap}
  .kpi thead th.val{text-align:right;background:var(--green-hd);color:var(--green);
                    font-size:12px;letter-spacing:1.5px;min-width:200px}
  .kpi td{padding:10px 16px;border-bottom:1px solid #EFF1F4}
  .kpi td.val{text-align:right;background:var(--green-bg);font-variant-numeric:tabular-nums;
              font-weight:600;white-space:nowrap}
  .kpi tr:last-child td{border-bottom:none}
  .kpi tr.sep td{border-top:2px solid var(--border)}
  .kpi tr.g-ontem td:first-child{background:#FAFAFB}
  .kpi tr.g-hoje  td:first-child{background:var(--blue-bg)}
  .kpi tr.g-hoje  td.val{background:#EDF3FC}
  .kpi tr.destaque td{font-weight:700}
  .kpi tr.destaque td:first-child{color:var(--navy)}
  .kpi .hint{color:var(--muted);font-size:11px;font-weight:400;margin-left:6px}

  .pct{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:700;min-width:56px;text-align:center}
  .pct-green{background:#ECFDF5;color:var(--green)}
  .pct-amber{background:var(--amber-bg);color:var(--amber)}
  .pct-red{background:var(--red-bg);color:var(--red)}
  .neg{color:var(--red)} .pos{color:var(--green)}
  .zero{color:var(--muted);font-weight:400}

  /* TABELA DE CLOSERS */
  .closers thead tr{background:var(--navy)}
  .closers thead th{color:rgba(255,255,255,.7);font-size:10px;font-weight:600;letter-spacing:.5px;
                    text-transform:uppercase;padding:9px 14px;text-align:right;white-space:nowrap}
  .closers thead th:first-child{text-align:left}
  .closers td{padding:10px 14px;text-align:right;border-bottom:1px solid #EFF1F4;
              font-variant-numeric:tabular-nums;white-space:nowrap}
  .closers td:first-child{text-align:left;font-weight:600}
  .closers tbody tr:hover{background:#F8F9FF}
  .closers tr.total td{background:var(--gold-bg);border-top:2px solid var(--gold);font-weight:700;color:var(--navy)}
  .closers tr.total td:first-child{color:var(--gold)}

  /* AVISOS */
  .alerta{background:var(--amber-bg);border:1px solid #F5DFA8;border-left:3px solid var(--gold);
          border-radius:6px;padding:10px 14px;font-size:12px;color:var(--amber);margin-bottom:10px}
  details.meta-comp{background:var(--white);border:1px solid var(--border);border-radius:8px;
                    padding:12px 16px;font-size:12px;box-shadow:var(--shadow)}
  details.meta-comp summary{cursor:pointer;font-weight:600;color:var(--navy);font-size:12px;outline:none}
  details.meta-comp ul{margin:10px 0 0 18px;color:var(--muted);line-height:1.8}
  .closers .hint-bl{display:block;font-size:9px;font-weight:600;color:var(--muted);
                    letter-spacing:.3px;text-transform:none;margin-top:1px}
  .rodape{text-align:right;color:var(--muted);font-size:11px;font-style:italic;margin-top:14px}


  .graf{background:var(--white);border:1px solid var(--border);border-radius:8px;
        box-shadow:var(--shadow);padding:16px 18px 10px;margin-bottom:20px}
  .graf-tit{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:2px}
  .graf-sub{font-size:11px;color:var(--muted);margin-bottom:12px}
  .graf-box{position:relative;height:320px}
  .graf-box.alto{height:360px}

  /* janelinha com o total do mês, dentro do gráfico */
  .graf-total{position:absolute;top:2px;left:4px;z-index:3;pointer-events:none;
              background:rgba(255,255,255,.93);border:1px solid var(--border);
              border-radius:6px;padding:6px 10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .graf-total .gt-rot{font-size:9px;font-weight:700;color:var(--muted);
                      letter-spacing:.6px;text-transform:uppercase;line-height:1.2}
  .graf-total .gt-val{font-size:17px;font-weight:800;color:var(--navy);line-height:1.15;margin-top:1px}
  .graf-total .gt-pct{font-size:11px;font-weight:700;color:var(--muted)}
  /* o qualificador ("c/ multi", "bruto") não pode gritar mais que o próprio rótulo */
  .graf-total .gt-rot .gt-pct{font-size:9px;color:var(--gold)}
  .kcard .gt-eq{color:#43586F;font-weight:600}
  .graf-total .gt-sub{font-size:10px;color:var(--muted);line-height:1.3;margin-top:3px}
  .graf-total .gt-pos{color:#0D7A3E;font-weight:700}
  .graf-total .gt-neg{color:#B42318;font-weight:700}
  /* variante do jacaré: MTD + atingimento lado a lado */
  .graf-total .gt-cols{display:flex;gap:18px}
  .graf-total .gt-cols .gt-val{font-size:15px}
  .graf-total .gt-cols .gt-col+.gt-col{border-left:1px solid var(--border);padding-left:18px;margin-left:0}

  /* ABAS */
  .tabs{background:var(--white);border-bottom:1px solid var(--border);padding:0 24px;display:flex}
  .tab{padding:12px 18px;font-size:12px;font-weight:700;cursor:pointer;color:var(--muted);
       border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;letter-spacing:.3px}
  .tab:hover{color:var(--navy)}
  .tab.on{color:var(--gold);border-bottom-color:var(--gold)}
  .view{display:none}
  .view.on{display:block}

  /* RESUMO DAS FRENTES */
  .frentes thead tr{background:var(--navy)}
  .frentes thead th{color:rgba(255,255,255,.7);font-size:10px;font-weight:600;letter-spacing:.5px;
                    text-transform:uppercase;padding:10px 14px;text-align:right;white-space:nowrap}
  .frentes thead th:first-child{text-align:left}
  .frentes td{padding:11px 14px;text-align:right;border-bottom:1px solid #EFF1F4;
              font-variant-numeric:tabular-nums;white-space:nowrap}
  .frentes td:first-child{text-align:left;font-weight:700;color:var(--navy)}
  .frentes tbody tr:hover{background:#F8F9FF}
  .frentes tr.total td{background:var(--gold-bg);border-top:2px solid var(--gold);font-weight:700}
  .frentes tr.total td:first-child{color:var(--gold)}
  .frentes tr.zerada td:first-child{color:var(--muted)}
  .frentes tr.zerada td{color:var(--muted)}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:22px}
  .kcard{background:var(--white);border:1px solid var(--border);border-left:3px solid var(--gold);
         border-radius:8px;padding:14px 16px;box-shadow:var(--shadow)}
  /* o rótulo e o botão "Detalhamento" dividem a linha de cima. Com float o botão
     invadia o número nos rótulos longos ("Realizado c/ multiplicador"); flex resolve. */
  .kcard .rot{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;
              display:flex;align-items:flex-start;justify-content:space-between;gap:8px;min-height:15px}
  .kcard .rot .btn-det{float:none;flex:0 0 auto;margin-top:-2px}
  .kcard .val{font-size:22px;font-weight:700;color:var(--navy);margin-top:6px;font-variant-numeric:tabular-nums}
  .kcard .sub{font-size:11px;color:var(--muted);margin-top:3px}
  .kcard.hoje{border-left-color:#1E3A8A;background:var(--blue-bg)}
  .kcard.ontem{border-left-color:var(--muted)}
  .kcard.futuro{border-left-color:#7A8CA8;background:#FBFCFE}
  .kcard.forte{border-left-width:4px}
  .kcard .val.pos{color:var(--green)}
  .kcard .val.neg{color:var(--red)}
  /* "23/77" ao lado do ticket: sobre quantas vendas a conta foi feita */
  .tk-base{display:inline-block;margin-left:5px;padding:0 4px;border-radius:3px;
           background:#F2F3F7;border:1px solid #D3D6E0;color:var(--muted);
           font-size:9px;font-weight:700;cursor:help;vertical-align:middle}

  /* hover das linhas de produto: flutuante, sóbrio, sem roubar o clique */
  .linha-prod{cursor:default}
  .linha-prod:hover td{background:#F4F6FB}
  .pt-varia{margin-left:5px;color:var(--amber);font-weight:800;cursor:help}
  .tip-prod{position:fixed;z-index:9999;pointer-events:none;max-width:560px;
            background:var(--white);border:1px solid var(--border);border-radius:7px;
            box-shadow:0 6px 20px rgba(26,26,46,.16);overflow:hidden}
  .tip-prod[hidden]{display:none}
  .tip-prod .tp-head{background:var(--navy);color:#fff;font-size:11px;font-weight:700;
                     padding:7px 11px;letter-spacing:.3px}
  .tip-prod .tp-sub{display:block;color:var(--gold);font-size:10px;font-weight:600;margin-top:2px}
  .tip-prod .tp-tab{border-collapse:collapse;width:100%}
  .tip-prod .tp-tab td{padding:5px 11px;font-size:11px;border-bottom:1px solid #EFF1F4;
                       white-space:nowrap}
  .tip-prod .tp-tab tr:last-child td{border-bottom:none}
  .tip-prod .tp-dia{color:var(--muted);font-variant-numeric:tabular-nums}
  .tip-prod .tp-id{color:var(--muted);font-size:10px}
  .tip-prod .tp-tit{color:var(--navy);font-weight:600;max-width:230px;overflow:hidden;
                    text-overflow:ellipsis}
  .tip-prod .tp-dono{color:#43586F}
  .tip-prod .tp-val{text-align:right;font-weight:700;color:var(--navy);
                    font-variant-numeric:tabular-nums}
  .tip-prod .tp-flag{color:var(--amber)}
  .tip-prod .tp-mais{padding:5px 11px;font-size:10px;color:var(--muted);background:#FAFBFD}
  .tip-prod .tp-pe{padding:7px 11px;font-size:10px;color:var(--muted);
                   border-top:1px solid var(--border);background:#FAFBFD;white-space:normal}
  .tip-prod .tp-pe b{color:var(--navy)}

  /* alertinha de dado faltando: avisa sem virar carnaval */
  .aviso-multi{margin-top:6px;padding:4px 8px;border-radius:4px;background:var(--amber-bg);
               border:1px solid #F0D9A8;color:var(--amber);font-size:10px;font-weight:700;
               line-height:1.35;cursor:help}
  .det .aviso-multi{display:inline-block;margin:0;font-size:9px;padding:1px 6px}

  /* BLOCOS — uma linha por assunto */
  .bloco{margin-bottom:18px}
  .bloco-tit{font-size:10px;font-weight:800;color:var(--navy);letter-spacing:1.2px;
             text-transform:uppercase;display:flex;align-items:center;gap:9px;margin-bottom:8px}
  .bloco-tit::before{content:'';width:3px;height:11px;background:var(--gold);border-radius:2px}
  .bloco-tit .qd{font-weight:600;color:var(--muted);letter-spacing:.3px;text-transform:none;font-size:11px}
  .bloco-tit .rule{flex:1;height:1px;background:var(--border)}
  .bloco .cards{margin-bottom:0;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
  .bloco .cards.c2{max-width:calc(50% - 6px)}
  .bloco .cards.c3{max-width:calc(75% - 3px)}
  @media (max-width:1100px){
    .bloco .cards{grid-template-columns:repeat(2,1fr)}
    .bloco .cards.c2,.bloco .cards.c3{max-width:100%}
  }
  @media (max-width:560px){ .bloco .cards{grid-template-columns:1fr} }

  .btn-det{float:right;background:transparent;border:1px solid var(--border);border-radius:4px;
           color:var(--muted);font-size:9px;font-weight:700;padding:2px 7px;cursor:pointer;
           text-transform:uppercase;letter-spacing:.4px;transition:all .15s}
  .btn-det:hover{border-color:var(--gold);color:var(--gold)}
  .det-box{background:var(--white);border:1px solid var(--border);border-radius:8px;
           box-shadow:var(--shadow);margin-bottom:22px;overflow:hidden}
  .det-head{background:var(--navy);padding:9px 16px;display:flex;align-items:center;
            justify-content:space-between;gap:10px;flex-wrap:wrap}
  .det-head .t{color:var(--gold);font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase}
  .det-head .x{background:transparent;border:1px solid rgba(255,255,255,.25);border-radius:4px;
               color:rgba(255,255,255,.65);font-size:10px;padding:3px 9px;cursor:pointer}
  .det-head .x:hover{border-color:var(--gold);color:var(--gold)}
  .det table{width:100%;border-collapse:collapse;font-size:12px}
  .det th{background:#F7F8FA;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.5px;
          text-transform:uppercase;padding:8px 14px;text-align:left;border-bottom:1px solid var(--border)}
  .det td{padding:9px 14px;border-bottom:1px solid #EFF1F4;vertical-align:middle}
  .det tr:hover{background:#F8F9FF}
  .det .hora{font-variant-numeric:tabular-nums;font-weight:700;color:var(--navy);white-space:nowrap}
  .det a{color:var(--navy);text-decoration:none;font-weight:600}
  .det a:hover{text-decoration:underline}
  .st{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;
      border:1px solid;white-space:nowrap}
  .st-realizada{background:#ECFDF5;color:var(--green);border-color:#A7D8BE}
  .st-nao_validada{background:var(--amber-bg);color:var(--amber);border-color:#F0D9A8}
  .st-pendente{background:var(--blue-bg);color:#1E3A8A;border-color:#C9D4E8}
  .st-motivo{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.3}
  .det-vazio{padding:22px;text-align:center;color:var(--muted);font-size:12px}
  .det-nota{padding:10px 16px;font-size:11px;color:var(--muted);border-top:1px solid var(--border);line-height:1.6}
  .det-nota b{color:var(--navy)}
  .det th.num,.det td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .det tr.total td{background:var(--gold-bg);border-top:2px solid var(--gold);font-weight:700;color:var(--navy)}
  .det tr.total td:first-child{color:var(--gold);font-size:10px;letter-spacing:.5px;text-transform:uppercase}
  .det .gt-eq{color:var(--amber);font-weight:700;font-size:10px}
  .det .obs{font-size:11px;color:var(--muted)}
  .det table.conta td:first-child{color:var(--navy);font-weight:600}
  .det table.conta tr:last-child td{border-bottom:none}
  .det tr.mtd-hoje td{background:var(--blue-bg)}
  .det tr.mtd-futuro td{color:var(--muted)}
  .det tr.mtd-futuro .hora{color:var(--muted);font-weight:600}

  .nota-comp{font-size:11px;color:var(--muted);padding:9px 4px 0;line-height:1.6}
  .nota-comp b{color:var(--navy)}

  .peso-nota{font-size:10px;font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0}

  /* PIPE A ARRUMAR */
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .chip{border-radius:6px;padding:7px 12px;font-size:12px;border:1px solid;background:var(--white)}
  .chip b{font-size:14px;margin-right:4px}
  .chip-sem_data{border-color:#E8B4B4;color:var(--red);background:var(--red-bg)}
  .chip-sem_probabilidade{border-color:#F0D9A8;color:var(--amber);background:var(--amber-bg)}
  .chip-prob_fora{border-color:#C9D4E8;color:#1E3A8A;background:var(--blue-bg)}
  .pend thead tr{background:var(--navy)}
  .pend thead th{color:rgba(255,255,255,.7);font-size:10px;font-weight:600;letter-spacing:.5px;
                 text-transform:uppercase;padding:9px 14px;text-align:left;white-space:nowrap}
  .pend thead th.num{text-align:right}
  .pend td{padding:9px 14px;border-bottom:1px solid #EFF1F4;font-size:12px;vertical-align:middle}
  .pend td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .pend tbody tr:hover{background:#F8F9FF}
  .pend .tit a{color:var(--navy);text-decoration:none;font-weight:600}
  .pend .tit a:hover{text-decoration:underline}
  .pend .falta{color:var(--red);font-weight:700}
  .tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;
       letter-spacing:.3px;white-space:nowrap;border:1px solid}
  .tag-sem_data{background:var(--red-bg);color:var(--red);border-color:#E8B4B4}
  .tag-sem_probabilidade{background:var(--amber-bg);color:var(--amber);border-color:#F0D9A8}
  .tag-prob_fora{background:var(--blue-bg);color:#1E3A8A;border-color:#C9D4E8}
  .pend tr.total td{background:var(--gold-bg);border-top:2px solid var(--gold);font-weight:700}
  .pend-vazio{padding:22px;text-align:center;color:var(--green);font-size:12px;font-weight:600}

  /* FORECAST */
  .fc{width:100%;border-collapse:collapse}
  .fc thead tr{background:var(--navy)}
  .fc thead th{color:rgba(255,255,255,.7);font-size:10px;font-weight:600;letter-spacing:.5px;
               text-transform:uppercase;padding:9px 12px;text-align:left;white-space:nowrap}
  .fc thead th.num{text-align:right}
  .fc td{padding:7px 12px;border-bottom:1px solid #EFF1F4;font-size:12px;white-space:nowrap}
  .fc td.num{text-align:right;font-variant-numeric:tabular-nums}
  .fc td.dia{font-weight:600;color:var(--navy)}
  .fc td.prev{background:var(--gold-bg)}
  .fc td.real{background:var(--green-bg);color:var(--green);font-weight:600}
  .fc tr.fds td{background:#FAFAFC;color:var(--muted)}
  .fc tr.vazia td{color:#B9BDC7}
  .fc tr.passado td.dia{color:var(--muted);font-weight:500}
  .fc tr.e-hoje td{background:var(--blue-bg);border-top:1px solid #C9D4E8;border-bottom:1px solid #C9D4E8}
  .fc tr.e-hoje td.dia{color:var(--navy);font-weight:800}
  .fc .hoje-tag{background:var(--navy);color:#fff;font-size:9px;padding:1px 5px;
                border-radius:3px;letter-spacing:.5px;font-weight:700;margin-left:2px}
  .fc tr.total td{background:var(--gold-bg);border-top:2px solid var(--gold);font-weight:700}
  .fc-bt{background:transparent;border:1px solid var(--border);border-radius:4px;width:20px;height:20px;
         line-height:1;font-size:9px;color:var(--muted);cursor:pointer;margin-right:7px;padding:0}
  .fc-bt:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
  .fc-bt:disabled{opacity:.3;cursor:default}
  .fc-bt.aberto{background:var(--navy);border-color:var(--navy);color:#fff}
  .fc-det-linha td{padding:0;background:#F8F9FC;border-bottom:1px solid var(--border)}
  .fc-det{width:100%;border-collapse:collapse;margin:0}
  .fc-det thead th{background:#EEF0F5;color:var(--muted);font-size:9px;font-weight:700;
                   letter-spacing:.5px;text-transform:uppercase;padding:7px 14px;text-align:left}
  .fc-det thead th.num{text-align:right}
  .fc-det td{padding:7px 14px;border-bottom:1px solid #E8EAF0;font-size:12px}
  .fc-det td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .fc-det .tit a{color:var(--navy);text-decoration:none;font-weight:600}
  .fc-det .tit a:hover{text-decoration:underline}
  .fc-det .falta{color:var(--red);font-weight:700}
  .fc-det th.ord{cursor:pointer;user-select:none;white-space:nowrap;transition:color .12s}
  .fc-det th.ord:hover{color:var(--navy)}
  .fc-det th.ord .seta{margin-left:5px;font-size:8px;opacity:.35;letter-spacing:0}
  .fc-det th.ord:hover .seta{opacity:.7}
  .fc-det th.ord.ativo{color:var(--navy)}
  .fc-det th.ord.ativo .seta{opacity:1;color:var(--gold)}
  .fr{display:inline-block;padding:1px 7px;border-radius:3px;font-size:10px;font-weight:700;
      border:1px solid;white-space:nowrap}
  .fr-navigator{background:#F2F3F7;color:var(--navy);border-color:#D3D6E0}
  .fr-mgm{background:var(--gold-bg);color:var(--amber);border-color:#F0D9A8}
  .fr-renovacao{background:var(--blue-bg);color:#43586F;border-color:#C9D4E8}
  .fc-nota{padding:12px 16px;font-size:11px;color:var(--muted);line-height:1.7;
           border-top:1px solid var(--border);background:#FCFCFD}
  .fc-aviso{padding:12px 16px;font-size:12px;color:var(--text);background:var(--amber-bg);
            border-bottom:1px solid #F0D9A8}
  .fc-vazio{padding:18px;text-align:center;color:var(--muted);font-size:12px}

  /* MOTIVOS DE PERDA */
  .perda-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px;margin-bottom:20px}
  .perda-card{background:var(--white);border:1px solid var(--border);border-radius:8px;
              box-shadow:var(--shadow);overflow:hidden}
  .perda-tit{display:flex;align-items:center;gap:8px;padding:12px 14px;font-size:12px;
             font-weight:700;color:var(--navy);border-bottom:1px solid var(--border)}
  .perda-tit .pt-dot{width:9px;height:9px;border-radius:2px;flex:none}
  .perda-tit .pt-qtd{margin-left:auto;font-size:11px;font-weight:600;color:var(--muted)}
  .perda{width:100%;border-collapse:collapse}
  .perda thead th{background:#F7F8FA;color:var(--muted);font-size:9px;font-weight:700;
                  letter-spacing:.6px;text-transform:uppercase;padding:7px 12px;text-align:left}
  .perda thead th.num{text-align:right}
  .perda td{padding:7px 12px;border-bottom:1px solid #F0F1F5;font-size:12px}
  .perda td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .perda td.pos-n{width:18px;color:#B9BDC7;font-size:10px;font-weight:700;padding-right:0}
  .perda td.mot{color:var(--text)}
  .perda tbody tr:hover{background:#FAFAFC}
  .perda tr.outros td{color:var(--muted);font-style:italic}
  .perda tr.total td{background:var(--gold-bg);border-top:2px solid var(--gold);font-weight:700}
  .perda .perda-vazio{text-align:center;color:var(--muted);padding:22px;font-style:italic}
  .fc-range{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--white);
            border:1px solid var(--border);border-radius:8px;padding:12px 16px;
            box-shadow:var(--shadow);margin-bottom:12px}
  .fc-range label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;
                  letter-spacing:.6px;display:flex;align-items:center;gap:7px}
  .fc-range input[type=date]{font-family:inherit;font-size:12px;font-weight:600;color:var(--navy);
            border:1px solid var(--border);border-radius:5px;padding:5px 8px;background:var(--white)}
  .fc-range input[type=date]:focus{outline:none;border-color:var(--gold)}
  .fc-bt-range{background:transparent;border:1px solid var(--border);border-radius:5px;
               color:var(--muted);font-size:10px;font-weight:700;padding:5px 10px;cursor:pointer;
               text-transform:uppercase;letter-spacing:.4px;font-family:inherit;transition:all .15s}
  .fc-bt-range:hover{border-color:var(--gold);color:var(--gold)}

  .loading{display:flex;align-items:center;justify-content:center;gap:12px;padding:60px;color:var(--muted)}
  .spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--gold);
           border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .erro{padding:40px;text-align:center;color:var(--red);font-size:13px}
  .erro code{display:block;margin-top:10px;font-size:11px;color:var(--muted);white-space:pre-wrap;text-align:left}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>

<body>

<header class="header">
  <div class="header-left">
    <div class="brand">
      <div class="brand-bar"></div>
      <div>
        <div class="brand-text">BOARD ACADEMY</div>
        <div class="brand-sub" id="brand-sub">Ascensão/MGM · Consolidado</div>
      </div>
    </div>
    <div class="periodo-badge" id="periodo-badge">Carregando…</div>
  </div>
  <div class="header-right">
    <select id="sel-mes" onchange="trocouPeriodo()"></select>
    <select id="sel-ano" onchange="trocouPeriodo()"></select>
    <button class="btn-reload" id="btn-reload" onclick="atualizarTudo()">Atualizar</button>
    <span class="update-info" id="update-info"></span>
  </div>
</header>

<div class="tabs">
  <div class="tab on" id="tab-mes"    onclick="setView('mes')">Painel do Mês</div>
  <div class="tab"    id="tab-graficos" onclick="setView('graficos')">Gráficos</div>
  <div class="tab"    id="tab-forecast" onclick="setView('forecast')">Forecast</div>
</div>

<div class="main">
  <div class="view on" id="view-mes">
    <div id="conteudo">
      <div class="card"><div class="loading"><div class="spinner"></div>Buscando dados…</div></div>
    </div>
  </div>
  <div class="view" id="view-graficos">
    <div id="conteudo-graficos">
      <div class="card"><div class="loading"><div class="spinner"></div>Carregando gráficos…</div></div>
    </div>
  </div>
  <div class="view" id="view-forecast">
    <div id="conteudo-forecast">
      <div class="card"><div class="loading"><div class="spinner"></div>Carregando forecast…</div></div>
    </div>
  </div>
</div>

<script>
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho',
               'Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

// senha opcional: propagada da URL (?k=...) para a chamada da API
const KEY = new URLSearchParams(location.search).get('k') || '';

const R = v => 'R$ ' + Number(v||0).toLocaleString('pt-BR',{maximumFractionDigits:0});
const N = v => Number(v||0).toLocaleString('pt-BR');
const fmtDia = s => s ? s.slice(8,10) + '/' + s.slice(5,7) : '';
const P = v => v == null ? '—' : Number(v).toFixed(1).replace('.',',') + '%';
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function pctTag(v){
  if (v == null) return '<span class="zero">—</span>';
  const c = v >= 100 ? 'pct-green' : v >= 60 ? 'pct-amber' : 'pct-red';
  return `<span class="pct ${c}">${P(v)}</span>`;
}
function money(v, opts={}){
  const n = Number(v||0);
  if (n === 0 && !opts.forcar) return '<span class="zero">R$ 0</span>';
  return R(n);
}

// ── TICKET MÉDIO COM PISO ─────────────────────────────────────
// O ticket só conta vendas a partir de TICKET_MINIMO (R$ 5.000 por padrão), porque
// reserva de R$ 497, parcela "1/2" e negócio zerado derrubavam o número. Mas aí o
// ticket passa a sair de MENOS vendas do que o volume ao lado dele — mostrar
// "77 vendas · ticket R$ 10.338" sem dizer que o ticket saiu de 23 é mentira por
// omissão. Então todo ticket vem acompanhado de quantas vendas entraram na conta.
let TICKET_MIN = 5000;

function tkNota(qtd, base){
  if (qtd == null || base == null || qtd === base) return '';
  return `<span class="tk-base" title="o ticket considera só as ${N(qtd)} venda(s) de ${
    R(TICKET_MIN)} para cima; as outras ${N(base - qtd)} continuam no volume e na soma"
    >${N(qtd)}/${N(base)}</span>`;
}

// para célula de tabela
function tkCel(v, qtd, base){ return money(v) + tkNota(qtd, base); }
// para texto corrido
function tkTxt(v, qtd, base){ return R(v) + tkNota(qtd, base); }

// ── seletores de período ──────────────────────────────────────
(function initSelects(){
  const hoje = new Date();
  const brNow = new Date(hoje.getTime() - (hoje.getTimezoneOffset()+180)*60000);
  const sm = document.getElementById('sel-mes');
  const sa = document.getElementById('sel-ano');
  MESES.forEach((m,i) => sm.add(new Option(m, i+1)));
  for (let a = brNow.getFullYear()-1; a <= brNow.getFullYear()+1; a++) sa.add(new Option(a, a));
  sm.value = brNow.getMonth()+1;
  sa.value = brNow.getFullYear();
})();

// ── render ────────────────────────────────────────────────────
function linha(rotulo, valorHtml, cls='', hint=''){
  return `<tr class="${cls}">
    <td>${rotulo}${hint ? `<span class="hint">${hint}</span>` : ''}</td>
    <td class="val">${valorHtml}</td>
  </tr>`;
}

function render(d){
  dadosPainel = d;
  const p = d.periodo, m = d.metricas;
  if (m && m.ticket_min != null) TICKET_MIN = m.ticket_min;

  document.getElementById('periodo-badge').innerHTML =
    `${MESES[p.mes-1]} ${p.ano} &nbsp;·&nbsp; <strong>${p.du_passados}</strong>/${p.du_total} dias úteis
     &nbsp;·&nbsp; <strong>${p.du_restantes}</strong> restantes`;
  document.getElementById('update-info').textContent = 'Atualizado: ' + p.atualizado_em;


  // ── respostas rápidas: ontem e hoje ──
  const reu = d.reunioes || {hoje:{}, ontem:{}};
  const cFunis = d.composicao || {};
  const sem = d.semana || {};
  const rmes = reu.mes || {agendadas:0, realizadas:0};
  const rfut = reu.futuras || {agendadas:0, dias:0};
  const conv = reu.conversao || {deals_com_reuniao:0, deals_ganhos:0, taxa:null};
  const df = d.detalhe_futuro || {};
  const gapCls = m.gap_100 > 0 ? 'neg' : 'pos';

  const bloco = (titulo, quando, cards) => {
    const n = (cards.match(/class="kcard/g) || []).length;
    return `
    <div class="bloco">
      <div class="bloco-tit">${titulo}${quando ? `<span class="qd">${quando}</span>` : ''}
        <div class="rule"></div></div>
      <div class="cards${n === 2 ? ' c2' : n === 3 ? ' c3' : ''}">${cards}</div>
    </div>`;
  };

  const card = (cls, rot, val, sub, extra='') => `
    <div class="kcard ${cls}">
      <div class="rot">${rot}${extra}</div>
      <div class="val">${val}</div>
      <div class="sub">${sub}</div>
    </div>`;

  // botão Detalhamento — um por card, cada bloco com a sua função e o seu painel
  const det  = q => `<button class="btn-det" onclick="verReunioes('${q}')">Detalhamento</button>`;
  const detG = q => `<button class="btn-det" onclick="verGanho('${q}')">Detalhamento</button>`;
  const detF = q => `<button class="btn-det" onclick="verFc('${q}')">Detalhamento</button>`;
  const detV = q => `<button class="btn-det" onclick="verVisao('${q}')">Detalhamento</button>`;

  // 1 ── REUNIÕES
  // ATENÇÃO: os quatro cards têm réguas DIFERENTES, por decisão do Rodrigo (out/26).
  // Por isso o mês pode ficar menor que o dia — não é bug, e o subtítulo de cada
  // card diz em voz alta qual régua está sendo usada. Não "corrija" isso sem falar
  // com ele: já foi reportado como bug uma vez e a resposta foi "é assim mesmo".
  const donosReu = (reu.donos || []).join(', ') || esc(reu.dono || DONO_REU);
  const bReunioes = bloco('Reuniões',
    `só funil Navigator/MGM, agendada por ${esc((reu.time || []).join(' ou ') || 'quem é do time')},
     em negócio de ${esc(donosReu)} · cada card tem uma régua, dita no rodapé dele`,
    card('ontem', 'Último dia útil', N(reu.ontem.realizadas || 0),
         `<b>realizadas</b> · de ${N(reu.ontem.agendadas || 0)} na agenda · ${fmtDia(p.ontem)}`,
         det('ontem')) +
    card('hoje', 'Hoje', N(reu.hoje.agendadas || 0),
         `<b>na agenda</b>, concluídas ou não · ${N(reu.hoje.realizadas || 0)} já validadas`,
         det('hoje')) +
    card('forte', 'Total do mês', N(rmes.realizadas || 0),
         `<b>realizadas</b> · de ${N(rmes.agendadas || 0)} na agenda · conversão ${P(conv.taxa)}
          (${N(conv.deals_ganhos || 0)}/${N(conv.deals_com_reuniao || 0)} negócios)`, det('mes')) +
    card('futuro', 'Futuras', N(rfut.pendentes || 0),
         `<b>pendentes</b> depois de hoje · em ${N(rfut.dias || 0)} dia(s)${
           rfut.realizadas ? ` · ${N(rfut.realizadas)} já marcada(s) como concluída(s)` : ''}`,
         det('futuras')));

  // 2 ── GANHO — duas réguas: EQUIPE (closers da lista) e FUNIL (tudo)
  const eqNomes = (d.equipe && d.equipe.lista || []).join(' + ') || 'closers';
  const soEq = v => v ? `<br><span class="gt-eq">equipe: ${v}</span>` : '';
  const bGanho = bloco('Ganho',
    `todo o funil (Navigator + MGM, qualquer dono) · "equipe" = recorte de ${esc(eqNomes)}`,
    card('ontem', 'Último dia útil', R(m.entrou_ontem_multi),
         `bruto ${R(m.entrou_ontem_bruto)} · ${fmtDia(p.ontem)}` +
         soEq(m.entrou_ontem_multi_equipe !== m.entrou_ontem_multi ? R(m.entrou_ontem_multi_equipe) : ''),
         detG('ontem')) +
    card('hoje', 'Hoje', R(m.entrou_hoje_multi),
         `bruto ${R(m.entrou_hoje_bruto)}` +
         soEq(m.entrou_hoje_multi_equipe !== m.entrou_hoje_multi ? R(m.entrou_hoje_multi_equipe) : ''),
         detG('hoje')) +
    card('forte', 'Total do mês', R(m.real_multi),
         `bruto ${R(m.real_bruto)} · ${N(m.qtd_ganhos_mes)} venda(s) · ticket ${
           tkTxt(m.ticket_medio, m.ticket_qtd, m.ticket_base)}` +
         soEq(m.real_multi_equipe !== m.real_multi
              ? `${R(m.real_multi_equipe)} · ${N(m.qtd_ganhos_mes_equipe)} venda(s)` : ''),
         detG('mes')) +
    card('futuro', 'Previsto futuro', R(df.previsto || 0),
         `ponderado do pipe de hoje em diante`, detG('futuro')));

  // 3 ── FORECAST
  const bForecast = bloco('Forecast', 'negócios em aberto com fechamento de hoje em diante',
    card('futuro', 'Pipe 20%', R(df.p20 || 0), `pondera ${R((df.p20 || 0) * 0.2)}`, detF('p20')) +
    card('futuro', 'Pipe 50%', R(df.p50 || 0), `pondera ${R((df.p50 || 0) * 0.5)}`, detF('p50')) +
    card('futuro', 'Pipe 70%', R(df.p70 || 0), `pondera ${R((df.p70 || 0) * 0.7)}`, detF('p70')) +
    card('forte', 'Total ponderado', R(df.previsto || 0),
         `de ${R(df.em_aberto || 0)} em aberto (${N(df.qtd || 0)} negócios)${
           cFunis.etapa_previsao ? ' · só em Negociação' : ''}`, detF('total')));

  // 4 ── VISÃO MÊS: onde estamos
  const bVisao1 = bloco('Visão mês', `${N(p.du_passados)} de ${N(p.du_total)} dias úteis`,
    card('forte', 'Meta do dia', R(m.meta_dia_ajust),
         m.du_com_hoje > 0
           ? `${R(m.gap_100)} que faltam ÷ ${N(m.du_com_hoje)} DU restantes${
               m.hoje_e_du ? ' (contando hoje)' : ''}<br>` +
             `<span class="gt-eq">meta linear era ${R(m.meta_dia)}</span>`
           : 'mês encerrado', detV('meta_dia')) +
    card('', 'Realizado', R(m.real_bruto), 'bruto, sem multiplicador' +
         soEq(m.real_bruto_equipe !== m.real_bruto ? R(m.real_bruto_equipe) : ''),
         detV('realizado')) +
    card('forte', 'Realizado c/ multiplicador', R(m.real_multi),
         'é este que bate contra a meta' +
         soEq(m.real_multi_equipe !== m.real_multi ? R(m.real_multi_equipe) : '') +
         ((m.sem_multi || {}).qtd
           ? `<div class="aviso-multi">⚠ ${N(m.sem_multi.qtd)} venda(s) sem multiplicador ·
              ${R(m.sem_multi.bruto)} entrando como zero</div>` : ''),
         detV('realizado_multi')) +
    card('', 'MTD — deveria estar', R(m.deveria_mtd),
         `${P(m.pct_mes_decorrido)} do mês decorrido`, detV('mtd')));

  // 5 ── VISÃO MÊS: como estamos
  const temRecorte = m.real_multi_equipe !== m.real_multi;
  const gapClsEq = m.gap_100_equipe > 0 ? 'neg' : 'pos';
  const bVisao2 = bloco('Visão mês', `atingimento e o que falta · meta ${R(m.meta_mes)}`, `
    <div class="kcard forte">
      <div class="rot">Atingimento${detV('atingimento')}</div>
      <div class="val ${m.atingimento >= 100 ? 'pos' : ''}">${P(m.atingimento)}</div>
      <div class="sub">c/ multiplicador · bruto ${P(m.atingimento_bruto)}${
        temRecorte ? `<br><span class="gt-eq">equipe: ${P(m.atingimento_equipe)}</span>` : ''}</div>
    </div>
    <div class="kcard forte">
      <div class="rot">Gap 100%${detV('gap')}</div>
      <div class="val ${gapCls}">${R(m.gap_100)}</div>
      <div class="sub">${m.du_com_hoje > 0
        ? `${R(m.meta_dia_ajust)}/dia nos ${N(m.du_com_hoje)} DU restantes`
        : 'mês encerrado'}${
        temRecorte ? `<br><span class="gt-eq">equipe: ${R(m.gap_100_equipe)}</span>` : ''}</div>
    </div>`);

  // 6 ── SEMANA
  const bSemana = bloco('Semana',
    sem.ini ? `${fmtDia(sem.ini)} a ${fmtDia(sem.fim)}` : '',
    card('', 'Ganho', R(sem.entrou_bruto || 0), 'bruto' +
         soEq(sem.entrou_bruto_equipe !== sem.entrou_bruto ? R(sem.entrou_bruto_equipe) : '')) +
    card('forte', 'Ganho c/ multiplicador', R(sem.entrou_multi || 0),
         'é o que conta para a meta' +
         soEq(sem.entrou_multi_equipe !== sem.entrou_multi ? R(sem.entrou_multi_equipe) : '')) +
    card('', 'Volume', N(sem.qtd_vendas || 0),
         'vendas fechadas na semana' +
         soEq(sem.qtd_vendas_equipe !== sem.qtd_vendas ? `${N(sem.qtd_vendas_equipe)} venda(s)` : '')) +
    card('futuro', 'Aberto na semana — ponderado', R(sem.previsto || 0),
         `ponderado · 70% ${R((sem.p70||0)*0.7)} · 50% ${R((sem.p50||0)*0.5)} · 20% ${R((sem.p20||0)*0.2)}
          <br>de ${R(sem.em_aberto || 0)} em aberto (${N(sem.qtd_abertos || 0)} negócios)`) +
    card('', 'Reuniões', N(sem.reunioes_validadas || 0),
         `validadas de ${N(sem.reunioes_agendadas || 0)} agendadas`));

  // 7 ── REFERIDOS (só volume: quantas pessoas foram indicadas)
  const rf = d.referidos;
  const detR = q => `<button class="btn-det" onclick="verRef('${q}')">Detalhamento</button>`;
  const bReferidos = !rf ? '' : bloco('Referidos',
    `Origem contém "${esc(rf.regra.origem)}" ou tag "${esc(rf.regra.tag)}"`,
    card('forte', 'Indicados no mês', N(rf.no_mes),
         `de ${N(rf.criados_no_mes)} negócio(s) criados no mês${
           rf.pct_do_mes == null ? '' : ` · ${P(rf.pct_do_mes)} da entrada`}`, detR('mes')) +
    card('', 'Por Origem', N(rf.por_origem),
         `campo Origem com "${esc(rf.regra.origem)}"`, detR('origem')) +
    card('', 'Por tag', N(rf.por_tag),
         `tag "${esc(rf.regra.tag)}"${rf.por_ambos ? ` · ${N(rf.por_ambos)} batem as duas` : ''}`,
         detR('tag')) +
    card('futuro', 'Indicados em aberto', N(rf.em_aberto),
         `no pipe agora, de qualquer mês · ${N(rf.ganhos_no_mes)} ganho(s) no mês`,
         detR('aberto')));

  const notaComp = d.consolidado ? `
    <div class="nota-comp">Consolidado: <b>Navigator</b> ${N(cFunis.navigator?.qtd || 0)} venda(s) ·
      ${R(cFunis.navigator?.valor || 0)} &nbsp;+&nbsp; <b>MGM</b> ${N(cFunis.mgm?.qtd || 0)} venda(s) ·
      ${R(cFunis.mgm?.valor || 0)}.${
        cFunis.etapa_previsao ? ` Forecast e pipe consideram só os ${N(cFunis.abertos_negociacao || 0)} negócios
        nas etapas <b>${esc((d.etapas_previsao || []).join(' · ') || cFunis.etapa_previsao)}</b>,
        de ${N(cFunis.abertos_total || 0)} abertos no total.` : ''}</div>` : '';

  // cada bloco tem o seu painel de detalhamento logo abaixo — abrir um não fecha
  // o do bloco vizinho, mas abrir outro card do MESMO bloco troca o conteúdo
  const blocos = bReunioes + `<div id="det-reunioes"></div>` +
                 bGanho    + `<div id="det-ganho"></div>` +
                 bForecast + `<div id="det-fc"></div>` +
                 bVisao1   + `<div id="det-visao"></div>` +
                 bVisao2   + `<div id="det-visao2"></div>` +
                 bSemana +
                 bReferidos + `<div id="det-referidos"></div>` + notaComp;

  // Renovação entra por duas portas (tag OU nome do produto). Dizer quantos vieram
  // de cada uma evita a pergunta "esse número tá certo?" e, mais importante, mostra
  // na hora se a tag parou de ser aplicada — foi o que deixou a frente zerada antes.
  const notaRenovacao = rr => {
    if (!rr) return '';
    const g = rr.ganhos || {}, a = rr.abertos || {};
    const regras = [];
    if (rr.tag_ativa) regras.push(`tag <b>${esc(rr.tag)}</b>`);
    if (rr.produto_ativo) regras.push(`nome do produto contendo <b>${
      (rr.termos_produto || []).map(t => esc(t)).join('</b> ou <b>')}</b>`);
    if (!regras.length) return '';
    const vindos = (x, rot) => {
      const tot = (x.so_tag || 0) + (x.so_produto || 0) + (x.por_ambas || 0);
      if (!tot) return `nenhum negócio ${rot}`;
      const p = [];
      if (x.so_tag)     p.push(`${N(x.so_tag)} só pela tag`);
      if (x.so_produto) p.push(`${N(x.so_produto)} só pelo produto`);
      if (x.por_ambas)  p.push(`${N(x.por_ambas)} pelas duas`);
      return `${N(tot)} ${rot} (${p.join(', ')})`;
    };
    const prods = Object.entries(g.produtos || {});
    return `
      <div class="nota-comp"><b>Renovação</b> entra por ${regras.join(' <b>ou</b> ')},
        sem acento e sem diferenciar maiúscula. No mês: ${vindos(g, 'ganho(s)')} ·
        ${vindos(a, 'em aberto')}.${
        prods.length ? ` Produtos que dispararam a regra: ${
          prods.map(([p, q]) => `${esc(p)} (${N(q)})`).join(', ')}.` : ''}${
        rr.tag_ativa && !((g.so_tag || 0) + (g.por_ambas || 0)) && (g.so_produto || 0)
          ? ` <b>Atenção:</b> nenhuma venda de Renovação veio pela tag este mês — todas
              entraram pelo nome do produto. Ou a tag parou de ser aplicada no Pipedrive,
              ou ela virou redundante.` : ''}</div>`;
  };

  // ── POR FRENTE (veio da antiga aba "Resumo — 3 Frentes") ──
  let frentesHtml = '';
  const fr = d.frentes;
  if (fr && (fr.linhas || []).length) {
    const linhaFr = (f, cls='') => `
      <tr class="${cls}${(f.meta === 0 && f.real_multi === 0) ? ' zerada' : ''}">
        <td>${esc(f.nome)}</td>
        <td>${f.meta > 0 ? R(f.meta) : '<span class="zero">—</span>'}</td>
        <td>${f.deveria_mtd > 0 ? R(f.deveria_mtd) : '<span class="zero">—</span>'}</td>
        <td>${money(f.real_bruto)}</td>
        <td>${money(f.real_multi)}</td>
        <td>${pctTag(f.pct)}</td>
        <td>${f.gap > 0 ? `<span class="neg">${R(f.gap)}</span>`
                        : `<span class="pos">${R(Math.abs(f.gap))}</span>`}</td>
        <td>${f.meta_dia_rest > 0 ? R(f.meta_dia_rest) : '<span class="zero">—</span>'}</td>
        <td>${N(f.qtd)}</td>
        <td>${tkCel(f.ticket, f.ticket_qtd, f.ticket_base)}</td>
        <td>${money(f.pipe_aberto)}</td>
      </tr>`;
    frentesHtml = `
      <div class="block-title">Por frente<div class="rule"></div>
        <span class="peso-nota">ticket = média das vendas ≥ ${R(TICKET_MIN)}${
          ''} · o <b>n/n</b> ao lado diz quantas entraram na conta</span></div>
      <div class="card">
        <div class="table-scroll">
          <table class="frentes">
            <thead><tr>
              <th>Frente</th><th>Meta</th><th>Deveria (MTD)</th><th>Bruto</th>
              <th>Multiplicador</th><th>% Ating.</th><th>Gap</th><th>Meta/Dia rest.</th>
              <th>Vol.</th><th>Ticket</th><th>Pipe aberto</th>
            </tr></thead>
            <tbody>${fr.linhas.map(f => linhaFr(f)).join('')}${linhaFr(fr.total, 'total')}</tbody>
          </table>
        </div>
      </div>${notaRenovacao(fr.regra_renovacao)}`;
  }

  // ── closers ──
  let closersHtml = '';
  if ((d.closers || []).length) {
    const tb = d.closers.map(c => `
      <tr>
        <td>${c.nome}</td>
        <td>${c.meta > 0 ? R(c.meta) : '<span class="zero">sem meta na planilha</span>'}</td>
        <td>${money(c.real_bruto)}</td>
        <td>${money(c.real_multi)}</td>
        <td>${pctTag(c.pct)}</td>
        <td>${N(c.qtd)}</td>
        <td>${tkCel(c.ticket, c.ticket_qtd, c.ticket_base)}</td>
        <td>${money(c.previsto_hoje)}</td>
        <td>${money(c.aberto_hoje)}</td>
      </tr>`).join('');

    const t = d.closers.reduce((a,c) => ({
      meta:a.meta+(c.meta||0), bruto:a.bruto+c.real_bruto, multi:a.multi+c.real_multi,
      qtd:a.qtd+c.qtd, prev:a.prev+c.previsto_hoje, ab:a.ab+c.aberto_hoje,
      // o ticket do TOTAL não pode ser bruto÷qtd: isso ignora o piso e dá um número
      // diferente do que está nas linhas acima. Só o backend sabe quais vendas
      // entraram no ticket, então o total também vem de lá.
      tkQtd:a.tkQtd+(c.ticket_qtd||0), tkBase:a.tkBase+(c.ticket_base||0)
    }), {meta:0,bruto:0,multi:0,qtd:0,prev:0,ab:0,tkQtd:0,tkBase:0});

    const eq = d.equipe || {};
    const notaEquipe = (eq.fora || []).length ? `
      <div class="nota-comp" style="border-left:3px solid var(--amber);background:var(--amber-bg)">
        Os totais do painel somam <b>todo o funil</b>. Esta tabela mostra só
        ${esc((eq.lista || []).join(' e '))}, então ela <b>não fecha</b> com o topo:
        ficam de fora ${eq.fora.map(f => `<b>${esc(f.nome)}</b> ${N(f.qtd)} venda(s) · ${R(f.real_multi)}`)
          .join(' &nbsp;·&nbsp; ')} — ${R(eq.fora_multi)} no total, ${P(eq.pct_fora)} do mês.
      </div>` : '';

    closersHtml = `
    <div class="block-title">Por Closer<div class="rule"></div>
      <span class="peso-nota">meta individual = comissionamento · não soma na meta da equipe ·
        ticket = média das vendas ≥ ${R(TICKET_MIN)}</span></div>
    ${notaEquipe}
    <div class="card">
      <div class="table-scroll">
        <table class="closers">
          <thead><tr>
            <th>Closer</th><th>Meta</th><th>Bruto</th><th>Multiplicador</th>
            <th>% Ating.</th><th>Vol.</th><th>Ticket</th>
            <th>Previsto Hoje</th><th>Em Aberto Hoje</th>
          </tr></thead>
          <tbody>
            ${tb}
            <tr class="total">
              <td>TOTAL</td>
              <td>${R(m.meta_mes)}<span class="hint-bl">meta da equipe</span></td>
              <td>${R(t.bruto)}</td>
              <td>${R(t.multi)}</td>
              <td>${pctTag(m.meta_mes > 0 ? t.multi/m.meta_mes*100 : null)}</td>
              <td>${N(t.qtd)}</td>
              <td>${tkCel(m.ticket_medio, m.ticket_qtd, m.ticket_base)}</td>
              <td>${R(t.prev)}</td>
              <td>${R(t.ab)}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>`;
  }


  // ── SDRs ──
  let sdrHtml = '';
  if ((d.sdrs || []).length) {
    const linhas = d.sdrs.map(s => `
      <tr>
        <td>${esc(s.nome)}${s.encontrado_no_pipedrive ? '' : ' <span class="tag tag-sem_data">não achei no Pipedrive</span>'}</td>
        <td>${s.meta_reuniao > 0 ? N(s.meta_reuniao) : '<span class="zero">—</span>'}</td>
        <td>${s.meta_diaria > 0 ? s.meta_diaria.toFixed(1).replace('.',',') : '<span class="zero">—</span>'}</td>
        <td><b>${N(s.validadas)}</b></td>
        <td>${s.deveria_estar > 0 ? Math.round(s.deveria_estar) : '<span class="zero">—</span>'}</td>
        <td>${s.meta_reuniao > 0 ? (s.faltam <= 0
              ? `<span class="pos">+${N(Math.abs(Math.round(s.faltam)))}</span>`
              : `<span class="neg">${N(Math.round(s.faltam))}</span>`) : '<span class="zero">—</span>'}</td>
        <td>${pctTag(s.pct_reu)}</td>
        <td>${s.meta_ganho > 0 ? R(s.meta_ganho) : '<span class="zero">—</span>'}</td>
        <td>${N(s.qtd_ganhos)}</td>
        <td>${money(s.valor_ganho)}</td>
        <td>${money(s.valor_ganho_multi)}</td>
        <td>${pctTag(s.pct_ganhos)}</td>
        <td>${pctTag(s.pct_final)}</td>
      </tr>`).join('');
    const pesos = d.sdrs[0].pesos || '70/30';
    sdrHtml = `
      <div class="block-title">Por SDR<div class="rule"></div>
        <span class="peso-nota">% Final = % Reunião x ${pesos.split('/')[0]}% + % Ganhos x ${pesos.split('/')[1]}%</span>
      </div>
      <div class="card">
        <div class="table-scroll">
          <table class="closers">
            <thead><tr>
              <th>SDR</th><th>Meta Reu.</th><th>Meta/Dia</th><th>Validadas</th>
              <th>Deveria Estar</th><th>Faltam</th><th>% Reu.</th>
              <th>Meta Ganho</th><th>Qtd</th><th>R$ Ganho</th><th>R$ c/ Multi</th>
              <th>% Ganhos</th><th>% Final</th>
            </tr></thead>
            <tbody>${linhas}</tbody>
          </table>
        </div>
      </div>`;
  }

  // ── pipe a arrumar ──
  let pendHtml = '';
  const pend = d.pendencias;
  if (pend) {
    const ordem = ['sem_data','sem_probabilidade','prob_fora'];
    const chips = ordem.map(k => {
      const r = pend.resumo[k];
      if (!r || !r.qtd) return '';
      return `<div class="chip chip-${k}"><b>${r.qtd}</b> ${r.label} · ${R(r.valor)}</div>`;
    }).join('');

    const corpo = pend.qtd_total
      ? pend.itens.map(i => `
          <tr>
            <td class="tit"><a href="${i.url}" target="_blank" rel="noopener">${esc(i.titulo)} ↗</a></td>
            <td>${esc(i.dono)}</td>
            <td class="num">${R(i.valor)}</td>
            <td class="num">${i.prev_fechamento || '<span class="falta">faltando</span>'}</td>
            <td class="num">${i.probabilidade == null ? '<span class="falta">faltando</span>' : i.probabilidade + '%'}</td>
            <td><span class="tag tag-${i.motivo}">${i.motivo_label}</span></td>
          </tr>`).join('') +
        `<tr class="total">
            <td>TOTAL A CORRIGIR</td><td>${pend.qtd_total} deals</td>
            <td class="num">${R(pend.valor_total)}</td>
            <td class="num" colspan="3">${P(pend.valor_abertos ? pend.valor_total/pend.valor_abertos*100 : 0)} do pipe aberto (${R(pend.valor_abertos)})</td>
         </tr>`
      : '';

    pendHtml = `
      <div class="block-title">Pipe a arrumar${pend.filtrado_por ? ` — ${esc(pend.filtrado_por)}` : ''}<div class="rule"></div></div>
      ${chips ? `<div class="chips">${chips}</div>` : ''}
      <div class="card">
        ${pend.qtd_total ? `
        <div class="table-scroll">
          <table class="pend">
            <thead><tr>
              <th>Negócio</th><th>Dono</th><th class="num">Valor</th>
              <th class="num">Prev. Fechamento</th><th class="num">Prob.</th><th>O que falta</th>
            </tr></thead>
            <tbody>${corpo}</tbody>
          </table>
        </div>` : '<div class="pend-vazio">✓ Pipe limpo — todos os negócios abertos têm data e probabilidade preenchidas.</div>'}
      </div>`;
  }

  // ── alertas + composição da meta ──
  const alertas = (d.alertas || []).map(a => `<div class="alerta">⚠ ${a}</div>`).join('');
  const comp = (d.meta_composicao || []).length
    ? `<details class="meta-comp">
         <summary>De onde vem a Meta Mês de ${R(m.meta_mes)} (${d.meta_composicao.length} closer(s) na planilha)</summary>
         <ul>${d.meta_composicao.map(c => `<li>${esc(c.nome)} — ${R(c.meta)}${
             c.e_da_equipe ? ' <b>← meta da EQUIPE, é esta que o painel usa</b>'
                           : ' <span class="hint">individual, só para comissionamento</span>'}</li>`).join('')}</ul>
         <p style="margin-top:8px;color:var(--muted);font-size:11px">
           As metas individuais <b>não somam</b> na meta do time: elas existem para
           comissionamento e já estão contidas na meta da equipe.</p>
       </details>`
    : '';

  document.getElementById('conteudo').innerHTML =
    `${blocos}${frentesHtml}${closersHtml}${sdrHtml}${pendHtml}${alertas}${comp}
     <div class="rodape">Funil ${d.funil} (pipeline ${d.pipeline_id}) · atualizado em ${p.atualizado_em}</div>`;
}

// ── fetch ─────────────────────────────────────────────────────
async function carregar(){
  document.getElementById('conteudo').innerHTML =
    '<div class="card"><div class="loading"><div class="spinner"></div>Buscando dados do Navigator…</div></div>';
  try {
    const mes = document.getElementById('sel-mes').value;
    const ano = document.getElementById('sel-ano').value;
    // /api/index é o path canônico da function na Vercel — sempre chega no Python.
    // fmt=json é o que diz ao backend para devolver os dados do painel.
    const q = new URLSearchParams({fmt: 'json', mes, ano});
    if (KEY) q.set('k', KEY);
    const res  = await fetch('/api/index?' + q.toString());
    const data = await res.json();
    if (data.erro) {
      const extra = data.funis_disponiveis
        ? '<code>Funis encontrados no Pipedrive:\n· ' + data.funis_disponiveis.join('\n· ') + '</code>'
        : (data.trace ? `<code>${data.trace}</code>` : '');
      document.getElementById('conteudo').innerHTML =
        `<div class="card"><div class="erro">${data.erro}${extra}</div></div>`;
      return;
    }
    render(data);
  } catch (e) {
    document.getElementById('conteudo').innerHTML =
      `<div class="card"><div class="erro">Falha ao carregar: ${e.message}</div></div>`;
  }
}

// ── DETALHAMENTO DE REUNIÕES ──────────────────────────────────
let dadosPainel = null;
const ST_LABEL = {realizada:'Validada', nao_validada:'Não validada', pendente:'Pendente'};

let DONO_REU = 'Denise Mussolin';

// ── motor dos painéis de detalhamento ─────────────────────────
// Um painel por bloco. Clicar no mesmo card fecha; clicar em outro card do
// mesmo bloco troca o conteúdo. Toda caixa sai pela mesma porta, então o
// cabeçalho e o botão "fechar" se comportam igual nos 18 cards.
function fechaDet(boxId){
  const box = document.getElementById(boxId);
  if (!box) return;
  box.innerHTML = '';
  box.dataset.aberto = '';
}

function abreDet(boxId, chave, titulo, corpo, nota){
  const box = document.getElementById(boxId);
  if (!box) return;
  if (box.dataset.aberto === chave) { fechaDet(boxId); return; }
  box.dataset.aberto = chave;
  box.innerHTML = `
    <div class="det-box det">
      <div class="det-head">
        <span class="t">${titulo}</span>
        <button class="x" onclick="fechaDet('${boxId}')">fechar</button>
      </div>
      ${corpo}
      ${nota ? `<div class="det-nota">${nota}</div>` : ''}
    </div>`;
  if (box.scrollIntoView) { try { box.scrollIntoView({behavior:'smooth', block:'nearest'}); } catch(e){} }
}

const FR_NOME = { navigator: 'Ascensão', mgm: 'MGM', renovacao: 'Renovação' };
const tagFr = f => `<span class="fr fr-${f || 'navigator'}">${esc(FR_NOME[f] || f || '—')}</span>`;
const sinalR = v => v >= 0 ? `<span class="pos">+${R(v)}</span>`
                           : `<span class="neg">−${R(Math.abs(v))}</span>`;

// tabela de VENDAS (dia, negócio, dono, frente, produto, bruto, multiplicador)
function tabelaGanhos(itens, vazio){
  if (!itens || !itens.length) return `<div class="det-vazio">${vazio}</div>`;
  let b = 0, m = 0;
  const linhas = itens.map(i => {
    b += (i.bruto || 0); m += (i.multi || 0);
    const temFator = i.fator != null && Math.abs(i.fator - 1) > 0.01;
    return `
    <tr>
      <td class="hora">${i.dia ? fmtDia(i.dia) : '—'}</td>
      <td><a href="${i.url}" target="_blank" rel="noopener">${esc(i.titulo)} ↗</a></td>
      <td>${esc(i.dono)}</td>
      <td>${tagFr(i.frente)}</td>
      <td>${esc(i.produto)}</td>
      <td class="num">${R(i.bruto)}</td>
      <td class="num">${i.sem_multi
        ? '<span class="aviso-multi">⚠ em branco</span>'
        : `<b>${R(i.multi)}</b>${
            temFator ? ` <span class="gt-eq">${i.fator.toFixed(2).replace('.',',')}x</span>` : ''}`}</td>
    </tr>`;
  }).join('');
  return `
    <table>
      <thead><tr>
        <th>Dia</th><th>Negócio</th><th>Dono</th><th>Frente</th><th>Produto</th>
        <th class="num">Bruto</th><th class="num">c/ Multiplicador</th>
      </tr></thead>
      <tbody>${linhas}
        <tr class="total">
          <td colspan="5">${N(itens.length)} venda(s)</td>
          <td class="num">${R(b)}</td><td class="num">${R(m)}</td>
        </tr></tbody>
    </table>`;
}

// ── GANHO: os 4 cards ─────────────────────────────────────────
function verGanho(qual){
  if (!dadosPainel) return;
  const p = dadosPainel.periodo, m = dadosPainel.metricas;
  const eq = ((dadosPainel.equipe || {}).lista || []).join(' + ') || 'os closers da lista';

  if (qual === 'futuro') {
    const it = (dadosPainel.detalhe_futuro || {}).itens || [];
    abreDet('det-ganho', qual,
      `Previsto futuro · ${R((dadosPainel.detalhe_futuro || {}).previsto || 0)} ponderado · ${N(it.length)} negócio(s)`,
      listaNegocios(it, 'Nenhum negócio em aberto com fechamento de hoje até o fim do mês.'),
      `Aqui <b>não tem venda</b>: são negócios ABERTOS com data prevista de hoje até o fim do
       mês, ponderados por 20/50/70. É promessa de pipe, não dinheiro. Clique no cabeçalho
       de qualquer coluna para ordenar.`);
    return;
  }

  const g = dadosPainel.ganhos_itens || [];
  const filtro = qual === 'hoje'  ? (i => i.dia === p.hoje)
               : qual === 'ontem' ? (i => i.dia === p.ontem)
               : (() => true);
  const rot = qual === 'hoje'  ? `Hoje · ${fmtDia(p.hoje)}`
            : qual === 'ontem' ? `Último dia útil · ${fmtDia(p.ontem)}`
            : `Total do mês · ticket médio ${R(m.ticket_medio)}${
                m.ticket_qtd !== m.ticket_base ? ` (${N(m.ticket_qtd)} de ${N(m.ticket_base)} venda(s))` : ''}`;
  const itens = g.filter(filtro);
  abreDet('det-ganho', qual, `Ganho — ${rot} · ${N(itens.length)} venda(s)`,
    tabelaGanhos(itens, 'Nenhuma venda fechada nesse período.'),
    `Entra <b>toda</b> venda dos funis Navigator + MGM, de qualquer dono — é a régua dos
     cards. O recorte "equipe" que aparece pequeno no card é só ${esc(eq)}.
     <b>c/ Multiplicador</b> é o campo do Pipedrive e é ele que bate contra a meta;
     o <b>x</b> ao lado aparece só quando o multiplicador é diferente de 1.`);
}

// ── FORECAST: os 4 cards ──────────────────────────────────────
function verFc(qual){
  if (!dadosPainel) return;
  const df = dadosPainel.detalhe_futuro || {};
  const it = df.itens || [];
  const PR = {p20: 20, p50: 50, p70: 70};
  const itens = qual === 'total' ? it : it.filter(i => i.probabilidade === PR[qual]);
  let soma = 0, pond = 0;
  itens.forEach(i => { soma += (i.valor || 0); pond += (i.ponderado || 0); });
  const rot = qual === 'total' ? 'Total ponderado' : `Pipe ${PR[qual]}%`;
  const semProb = qual === 'total' ? itens.filter(i => i.probabilidade == null).length : 0;

  abreDet('det-fc', qual,
    `Forecast — ${rot} · ${N(itens.length)} negócio(s) · ${R(soma)} em aberto · ${R(pond)} ponderado`,
    listaNegocios(itens, 'Nenhum negócio em aberto nesta faixa.'),
    `Negócios ABERTOS com fechamento previsto de hoje até o fim do mês${
      (dadosPainel.composicao || {}).etapa_previsao
        ? `, só nas etapas <b>${esc((dadosPainel.etapas_previsao || []).join(' · '))}</b>` : ''}.
     ${qual === 'total'
        ? `O ponderado soma 20% × ${R(df.p20 || 0)} + 50% × ${R(df.p50 || 0)} + 70% × ${R(df.p70 || 0)}.${
            semProb ? ` <b>${N(semProb)}</b> negócio(s) estão sem probabilidade preenchida e por isso
                        pesam zero no ponderado, mesmo aparecendo na lista.` : ''}`
        : `Cada um pesa ${PR[qual]}% do valor no ponderado.`}
     Clique no cabeçalho de qualquer coluna para ordenar.`);
}

// ── VISÃO MÊS: os 4 cards + atingimento e gap ─────────────────
const BOX_VISAO = {meta_dia:'det-visao', realizado:'det-visao', realizado_multi:'det-visao',
                   mtd:'det-visao', atingimento:'det-visao2', gap:'det-visao2'};

function verVisao(qual){
  if (!dadosPainel) return;
  const box = BOX_VISAO[qual] || 'det-visao';
  const m = dadosPainel.metricas, p = dadosPainel.periodo;
  const g = dadosPainel.ganhos_itens || [];
  const fr = dadosPainel.frentes;

  // 1) Realizado (bruto) e Realizado c/ multiplicador: a mesma lista, outra ordem
  if (qual === 'realizado' || qual === 'realizado_multi') {
    const bruto = qual === 'realizado';
    const itens = g.slice().sort((a, b) => bruto ? (b.bruto - a.bruto) : (b.multi - a.multi));
    const comFator = itens.filter(i => i.fator != null && Math.abs(i.fator - 1) > 0.01);
    const ganhoFator = itens.reduce((a, i) => a + ((i.multi || 0) - (i.bruto || 0)), 0);
    abreDet(box, qual,
      `${bruto ? 'Realizado (bruto)' : 'Realizado c/ multiplicador'} · ${
        R(bruto ? m.real_bruto : m.real_multi)} · ${N(itens.length)} venda(s)`,
      tabelaGanhos(itens, 'Nenhuma venda no mês.'),
      `Ordenado pelo valor ${bruto ? 'bruto' : 'com multiplicador'}, maior primeiro.
       ${comFator.length
          ? `<b>${N(comFator.length)}</b> de ${N(itens.length)} venda(s) têm multiplicador
             diferente de 1x, e é daí que vem ${sinalR(ganhoFator)} de diferença entre as
             duas colunas.`
          : `Nenhuma venda do mês tem multiplicador diferente de 1x — por isso as duas
             colunas batem.`}
       Contra a meta de ${R(m.meta_mes)} vale a coluna <b>c/ Multiplicador</b>.${
       (m.sem_multi || {}).qtd
         ? `<br>⚠ <b>${N(m.sem_multi.qtd)} venda(s)</b> estão com o campo em branco no
            Pipedrive (marcadas na tabela): ${R(m.sem_multi.bruto)} de bruto que contam
            <b>zero</b> contra a meta. É preenchimento, não venda perdida —
            ${(m.sem_multi.itens || []).slice(0, 5).map(i =>
              `<a href="${i.url}" target="_blank" rel="noopener">${esc(i.titulo)}</a> (${R(i.valor)})`
             ).join(', ')}${m.sem_multi.qtd > 5 ? ` e mais ${N(m.sem_multi.qtd - 5)}` : ''}.` : ''}`);
    return;
  }

  // 2) MTD: a curva dia a dia, que é onde se vê ONDE o atraso nasceu
  if (qual === 'mtd') {
    const c = (dadosPainel.curva_mtd || []).filter(x => x.e_du || x.qtd);
    const linhas = c.map(x => `
      <tr class="${x.dia === p.hoje ? 'mtd-hoje' : ''}${x.passado ? '' : ' mtd-futuro'}">
        <td class="hora">${fmtDia(x.dia)}</td>
        <td class="num">${x.e_du ? N(x.du) : '<span class="zero">—</span>'}</td>
        <td class="num">${x.entrou ? R(x.entrou) : '<span class="zero">—</span>'}</td>
        <td class="num">${x.qtd ? N(x.qtd) : '<span class="zero">—</span>'}</td>
        <td class="num">${R(x.meta_acum)}</td>
        <td class="num"><b>${R(x.real_acum)}</b></td>
        <td class="num">${x.passado ? sinalR(x.desvio) : '<span class="zero">—</span>'}</td>
      </tr>`).join('');
    abreDet(box, qual,
      `MTD — deveria estar ${R(m.deveria_mtd)} · está ${R(m.real_multi)} · ${
        sinalR(m.real_multi - m.deveria_mtd).replace(/<[^>]+>/g, '')}`,
      c.length ? `
        <table>
          <thead><tr>
            <th>Dia</th><th class="num">DU</th><th class="num">Entrou no dia</th>
            <th class="num">Vendas</th><th class="num">Meta acum.</th>
            <th class="num">Real acum.</th><th class="num">Desvio</th>
          </tr></thead>
          <tbody>${linhas}</tbody>
        </table>` : '<div class="det-vazio">Sem dias úteis no período.</div>',
      `A <b>meta acumulada</b> é linear: ${R(m.meta_dia)} por dia útil (${R(m.meta_mes)} ÷
       ${N(p.du_total)} DU). O <b>real acumulado</b> é com multiplicador. O <b>desvio</b> é a
       distância entre os dois — negativo é atraso. Dias ainda não vividos aparecem em cinza
       e sem desvio, só com a meta que vai cobrar. Fim de semana e feriado só aparecem se
       entrou venda neles.`);
    return;
  }

  // 3) Meta do dia: a conta aberta, porque é um número que ninguém confia de graça
  if (qual === 'meta_dia') {
    const linha = (rot, val, obs) => `
      <tr><td>${rot}</td><td class="num"><b>${val}</b></td><td class="obs">${obs || ''}</td></tr>`;
    const porFrente = !fr || !(fr.linhas || []).length ? '' : `
      <table>
        <thead><tr><th>Frente</th><th class="num">Falta</th><th class="num">Meta/dia restante</th></tr></thead>
        <tbody>${fr.linhas.map(f => `
          <tr><td>${esc(f.nome)}</td>
            <td class="num">${f.gap > 0 ? `<span class="neg">${R(f.gap)}</span>`
                                        : `<span class="pos">${R(Math.abs(f.gap))} a mais</span>`}</td>
            <td class="num"><b>${f.meta_dia_rest > 0 ? R(f.meta_dia_rest) : '<span class="zero">—</span>'}</b></td>
          </tr>`).join('')}
          <tr class="total"><td>TOTAL</td>
            <td class="num">${R(fr.total.gap)}</td>
            <td class="num">${R(fr.total.meta_dia_rest)}</td></tr>
        </tbody>
      </table>`;
    abreDet(box, qual, `Meta do dia · ${R(m.meta_dia_ajust)} — de onde sai esse número`,
      `<table class="conta">
         <tbody>
           ${linha('Meta do mês', R(m.meta_mes), 'planilha METAS')}
           ${linha('Realizado c/ multiplicador', R(m.real_multi), `${N(m.qtd_ganhos_mes)} venda(s) até agora`)}
           ${linha('Falta para 100%', R(m.gap_100), 'meta − realizado')}
           ${linha('Dias úteis que sobraram', N(m.du_com_hoje),
                   m.hoje_e_du ? 'contando hoje, que ainda dá para vender' : 'hoje não é dia útil')}
           ${linha('<b>Meta do dia ajustada</b>', R(m.meta_dia_ajust), 'o que falta ÷ dias que sobraram')}
           ${linha('Meta linear (referência)', R(m.meta_dia), `${R(m.meta_mes)} ÷ ${N(p.du_total)} DU do mês`)}
         </tbody>
       </table>${porFrente}`,
      `A meta do dia <b>corre atrás</b>: todo dia que fecha abaixo joga a diferença para
       dentro do gap, e o gap volta diluído nos dias que sobraram. Por isso ela sobe quando
       o mês atrasa e cai quando adianta — diferente da meta linear, que nunca muda.
       ${m.du_com_hoje > 0 ? '' : 'O mês já encerrou, então não há mais dia para dividir.'}`);
    return;
  }

  // 4) Atingimento e Gap: a quebra por frente, que é onde dá para agir
  if (qual === 'atingimento' || qual === 'gap') {
    const ating = qual === 'atingimento';
    const corpo = !fr || !(fr.linhas || []).length
      ? '<div class="det-vazio">Não consegui montar a quebra por frente agora.</div>'
      : `<table>
          <thead><tr>
            <th>Frente</th><th class="num">Meta</th><th class="num">Deveria (MTD)</th>
            <th class="num">Real c/ mult.</th><th class="num">% Ating.</th>
            <th class="num">Falta</th><th class="num">Meta/dia rest.</th>
          </tr></thead>
          <tbody>${fr.linhas.map(f => `
            <tr><td>${esc(f.nome)}</td>
              <td class="num">${f.meta > 0 ? R(f.meta) : '<span class="zero">—</span>'}</td>
              <td class="num">${f.deveria_mtd > 0 ? R(f.deveria_mtd) : '<span class="zero">—</span>'}</td>
              <td class="num"><b>${R(f.real_multi)}</b></td>
              <td class="num">${pctTag(f.pct)}</td>
              <td class="num">${f.gap > 0 ? `<span class="neg">${R(f.gap)}</span>`
                                          : `<span class="pos">${R(Math.abs(f.gap))} a mais</span>`}</td>
              <td class="num">${f.meta_dia_rest > 0 ? R(f.meta_dia_rest) : '<span class="zero">—</span>'}</td>
            </tr>`).join('')}
            <tr class="total"><td>TOTAL</td>
              <td class="num">${R(fr.total.meta)}</td>
              <td class="num">${R(fr.total.deveria_mtd)}</td>
              <td class="num">${R(fr.total.real_multi)}</td>
              <td class="num">${pctTag(fr.total.pct)}</td>
              <td class="num">${R(fr.total.gap)}</td>
              <td class="num">${R(fr.total.meta_dia_rest)}</td>
            </tr></tbody>
         </table>`;
    abreDet(box, qual,
      ating ? `Atingimento ${P(m.atingimento)} · ${R(m.real_multi)} de ${R(m.meta_mes)}`
            : `Gap 100% · ${R(m.gap_100)} para fechar ${R(m.meta_mes)}`,
      corpo,
      `Mesma régua do painel: real com multiplicador contra a meta da frente.
       ${fr && fr.total && Math.abs(fr.total.meta - m.meta_mes) > 1
          ? `<b>Atenção:</b> as frentes somam ${R(fr.total.meta)} e a meta do painel é
             ${R(m.meta_mes)} — a diferença de ${R(Math.abs(fr.total.meta - m.meta_mes))}
             está em METAS_FRENTES, não no Pipedrive.`
          : 'As metas por frente somam exatamente a meta do mês.'}`);
  }
}

// ── REUNIÕES: os 4 cards ──────────────────────────────────────
const ROT_REU = {ontem: 'Último dia útil', hoje: 'Hoje', mes: 'Total do mês', futuras: 'Futuras'};

function verReunioes(qual){
  const box = document.getElementById('det-reunioes');
  if (!box || !dadosPainel) return;
  if (box.dataset.aberto === qual) { box.innerHTML = ''; box.dataset.aberto = ''; return; }
  box.dataset.aberto = qual;

  const r = dadosPainel.reunioes || {};
  if (r.dono) DONO_REU = r.dono;
  const itens = qual === 'hoje'  ? (r.lista_hoje  || [])
              : qual === 'ontem' ? (r.lista_ontem || [])
              : qual === 'mes'   ? (r.lista_mes   || [])
              :                    (r.lista_futuras || []);
  // mês e futuras cruzam vários dias, então a coluna Dia só aparece nesses dois
  const multiDia = qual === 'mes' || qual === 'futuras';
  const dia = qual === 'hoje' ? dadosPainel.periodo.hoje
            : qual === 'ontem' ? dadosPainel.periodo.ontem : null;
  const dup = (qual === 'hoje' ? r.hoje : qual === 'ontem' ? r.ontem : {})?.duplicadas_ocultas || 0;
  const rot = ROT_REU[qual] || qual;

  // o cabeçalho tem que mostrar PRIMEIRO o número que está no card, senão volta a
  // confusão de comparar réguas diferentes. Conto da própria lista exibida.
  const nSt = s => itens.filter(i => i.status === s).length;
  const REGRA_CARD = {
    ontem:   {n: nSt('realizada'), rot: 'realizadas'},
    hoje:    {n: itens.length,     rot: 'na agenda'},
    mes:     {n: nSt('realizada'), rot: 'realizadas'},
    futuras: {n: nSt('pendente'),  rot: 'pendentes'},
  }[qual] || {n: itens.length, rot: 'registros'};

  const linhas = itens.map(i => `
    <tr>
      ${multiDia ? `<td class="hora">${fmtDia(i.dia)}</td>` : ''}
      <td class="hora">${i.hora || '—'}</td>
      <td>${esc(i.closer || i.responsavel)}</td>
      <td>${i.funil ? esc(i.funil) : '<span class="zero">—</span>'}</td>
      <td>${i.deal_url ? `<a href="${i.deal_url}" target="_blank" rel="noopener">${esc(i.deal || i.assunto)} ↗</a>` : esc(i.assunto)}</td>
      <td><span class="st st-${i.status}">${ST_LABEL[i.status]}</span></td>
    </tr>`).join('');

  box.innerHTML = `
    <div class="det-box det">
      <div class="det-head">
        <span class="t">Reuniões — ${rot} · ${dia ? dia + ' · ' : ''}${
          N(REGRA_CARD.n)} ${REGRA_CARD.rot} de ${N(itens.length)} na lista</span>
        <button class="x" onclick="verReunioes('${qual}')">fechar</button>
      </div>
      ${itens.length ? `
        <table>
          <thead><tr>${multiDia ? '<th>Dia</th>' : ''}<th>Hora</th><th>Closer</th><th>Funil</th><th>Negócio</th><th>Status</th></tr></thead>
          <tbody>${linhas}</tbody>
        </table>` : `<div class="det-vazio">Nenhuma reunião registrada ${
          qual === 'futuras' ? 'depois de hoje até o fim do mês.' :
          qual === 'mes' ? 'no mês.' : 'nesse dia.'}</div>`}
      <div class="det-nota">
        <b>Esta lista</b> é o universo do card: negócio nos funis Navigator/MGM, agendado
        por ${esc((r.time || []).join(' ou ') || 'alguém do time')}, em negócio de
        ${esc((r.donos || []).join(', ') || DONO_REU)}, com a data de vencimento no período.
        ${r.excluidos ? `Atividade com <b>${esc(r.excluidos)}</b> como responsável não entra: é a cópia que o Pipedrive gera para quem conduz.` : ''}
        <br><b>O card mostra ${N(REGRA_CARD.n)} (${REGRA_CARD.rot})</b> — ${{
          ontem:   'no dia anterior a pergunta é o que de fato aconteceu, então vale só a validada.',
          hoje:    'o dia ainda não acabou, então vale tudo que está marcado, concluído ou não.',
          mes:     'no fechamento do mês a pergunta é o que de fato aconteceu, então vale só a validada.',
          futuras: 'reunião que ainda vai acontecer é a que não está concluída.',
        }[qual] || ''}
        Os quatro cards usam réguas diferentes de propósito, então
        <b>eles não somam nem se comparam entre si</b> — o mês pode ser menor que o dia.
        <br><b>Validada</b> = concluída e dentro do filtro de Reunião Validada.
        <b>Não validada</b> = concluída, mas fora desse filtro.
        <b>Pendente</b> = ainda não marcada como concluída.
        ${dup > 0 ? `<br><b>${dup}</b> atividade(s) duplicada(s) no mesmo negócio foram ocultadas — no Pipedrive existe mais de uma para o mesmo negócio neste dia.` : ''}
        ${r.fora_escopo > 0 ? `<br><b>${r.fora_escopo}</b> reunião(ões) do mês ficaram de fora por estarem em funil que não é Navigator nem MGM.` : ''}
        ${r.fora_time > 0 ? `<br><b>${r.fora_time}</b> ficaram de fora porque quem agendou não está no time${
          Object.keys(r.responsaveis_fora || {}).length
            ? ': ' + Object.entries(r.responsaveis_fora).slice(0, 6)
                .map(([n, q]) => `${esc(n)} (${N(q)})`).join(', ') : ''}.` : ''}
        ${r.fora_dono > 0 ? `<br><b>${r.fora_dono}</b> ficaram de fora porque o negócio não é de nenhuma closer do time${
          Object.keys(r.donos_fora || {}).length
            ? ': ' + Object.entries(r.donos_fora).slice(0, 6)
                .map(([n, q]) => `${esc(n)} (${N(q)})`).join(', ') : ''}.` : ''}
        ${r.dono_incerto > 0 ? `<br><b class="falta">${r.dono_incerto}</b> reunião(ões) do mês estão
          <b>contadas mesmo sem eu saber de quem é o negócio</b> — ele não apareceu entre os ganhos,
          abertos ou perdidos que eu leio. Preferi contar a sumir com elas em silêncio, mas se esse
          número for alto vale olhar: ou é negócio de outro funil, ou de mês antigo.` : ''}
      </div>
    </div>`;
}

// ── REFERIDOS: os 4 cards ─────────────────────────────────────
const ST_REF = {Ganho: 'realizada', Aberto: 'pendente', Perdido: 'nao_validada'};

function tabelaRef(itens, vazio){
  if (!itens || !itens.length) return `<div class="det-vazio">${vazio}</div>`;
  let v = 0;
  const linhas = itens.map(i => {
    v += (i.valor || 0);
    return `
    <tr>
      <td class="hora">${fmtDia(i.criado)}</td>
      <td><a href="${i.url}" target="_blank" rel="noopener">${esc(i.titulo)} ↗</a></td>
      <td>${esc(i.dono)}</td>
      <td>${esc(i.funil)}</td>
      <td>${esc(i.origem)}</td>
      <td><span class="fr fr-${i.por === 'tag' ? 'renovacao' : i.por === 'origem' ? 'mgm' : 'navigator'}">${esc(i.por)}</span></td>
      <td class="num">${i.valor ? R(i.valor) : '<span class="zero">—</span>'}</td>
      <td><span class="st st-${ST_REF[i.status] || 'pendente'}">${esc(i.status)}</span></td>
    </tr>`;
  }).join('');
  return `
    <table>
      <thead><tr>
        <th>Criado</th><th>Negócio</th><th>Dono</th><th>Funil</th>
        <th>Origem</th><th>Entrou por</th><th class="num">Valor</th><th>Status</th>
      </tr></thead>
      <tbody>${linhas}
        <tr class="total"><td colspan="6">${N(itens.length)} indicação(ões)</td>
          <td class="num">${R(v)}</td><td></td></tr></tbody>
    </table>`;
}

function verRef(qual){
  if (!dadosPainel || !dadosPainel.referidos) return;
  const rf = dadosPainel.referidos;
  const doMes = rf.itens || [];

  const cfg = {
    mes: {
      itens: doMes,
      tit: `Indicados no mês · ${N(rf.no_mes)} de ${N(rf.criados_no_mes)} negócio(s) criados`,
      vazio: 'Nenhuma indicação entrou no mês.',
      nota: `A data é a de <b>criação</b> do negócio, então esta é a lista de quem
             <b>entrou</b> no mês — inclusive os que já foram perdidos depois.`,
    },
    origem: {
      itens: doMes.filter(i => i.por_origem),
      tit: `Indicados por Origem · ${N(rf.por_origem)} no mês`,
      vazio: 'Nenhuma indicação entrou pelo campo Origem neste mês.',
      nota: `Só os que têm <b>"${esc(rf.regra.origem)}"</b> no campo Origem.
             ${rf.por_ambos ? `<b>${N(rf.por_ambos)}</b> deles também têm a tag, então aparecem
             nas duas listas — por isso Origem + tag não soma o total.` : ''}`,
    },
    tag: {
      itens: doMes.filter(i => i.por_tag),
      tit: `Indicados por tag · ${N(rf.por_tag)} no mês`,
      vazio: 'Nenhuma indicação entrou pela tag neste mês.',
      nota: `Só os que têm a tag <b>"${esc(rf.regra.tag)}"</b>.
             ${rf.por_ambos ? `<b>${N(rf.por_ambos)}</b> deles também têm a Origem preenchida, então
             aparecem nas duas listas — por isso Origem + tag não soma o total.` : ''}`,
    },
    aberto: {
      itens: rf.itens_abertos || [],
      tit: `Indicados em aberto · ${N(rf.em_aberto)} no pipe`,
      vazio: 'Nenhuma indicação em aberto no pipe.',
      nota: `Esta é a única das quatro listas que <b>não é do mês</b>: é o pipe aberto de
             qualquer época. Por isso ela pode ser maior ou menor que a dos indicados do mês,
             e os dois números não se somam.`,
    },
  }[qual];
  if (!cfg) return;

  abreDet('det-referidos', qual, cfg.tit, tabelaRef(cfg.itens, cfg.vazio),
    `Entra quem tem Origem contendo <b>${esc(rf.regra.origem)}</b> ou a tag
     <b>${esc(rf.regra.tag)}</b>. ${cfg.nota}`);
}

// compat: botão antigo "Ver lista"
function verReferidos(){ verRef('mes'); }

// ── GRÁFICOS ──────────────────────────────────────────────────
const COR_FRENTE = { navigator: '#1A1A2E', mgm: '#B8860B', renovacao: '#7A8CA8' };
// perdidos em tons quentes dessaturados — separa do que é venda sem virar carnaval
const COR_PERDA  = { navigator: '#8C3A34', mgm: '#C08457', renovacao: '#B9A79B' };
let CHARTS = {};

function destroiCharts(){
  Object.values(CHARTS).forEach(c => { try { c.destroy(); } catch(e){} });
  CHARTS = {};
}
const diaCurto = s => s.slice(8,10) + '/' + s.slice(5,7);
const kBRL  = v => v >= 1000 ? 'R$ ' + (v/1000).toFixed(0) + 'k' : 'R$ ' + Math.round(v);
const ST_CURTO = { realizada: 'validada', nao_validada: 'não validada', pendente: 'pendente' };

// lista de reuniões do dia para o rodapé do tooltip
function detalheDoDia(dados, idx, apenasValidadas){
  const dia = dados.dias[idx];
  let itens = (dados.titulos || {})[dia] || [];
  if (apenasValidadas) itens = itens.filter(i => i.s === 'realizada');
  if (!itens.length) return '';
  const LIM = 8;
  const linhas = itens.slice(0, LIM).map(i =>
    `${i.h || '--:--'}  ${i.t}${i.r ? '  · ' + i.r : ''}` +
    (apenasValidadas ? '' : `  [${ST_CURTO[i.s] || i.s}${i.m ? ': ' + i.m : ''}]`));
  if (itens.length > LIM) linhas.push(`+ ${itens.length - LIM} outra(s)`);
  return linhas;
}

const kCurto = v => v >= 1000 ? (v/1000).toFixed(0) + 'k' : String(Math.round(v));  // cabe dentro da barra

// ── janelinha de total do mês, desenhada por cima do gráfico ───
const CURTO_FRENTE = { navigator: 'Ascensão', mgm: 'MGM', renovacao: 'Renovação' };

function somaSerie(mapa, fr){
  const partes = fr.map(f => ({
    chave: f.chave,
    nome: CURTO_FRENTE[f.chave] || f.nome,
    v: ((mapa || {})[f.chave] || []).reduce((a, b) => a + (Number(b) || 0), 0)
  }));
  return { tot: partes.reduce((a, p) => a + p.v, 0), partes };
}

function caixaTotal(rotulo, mapa, fr, fmt){
  const s = somaSerie(mapa, fr);
  const quebra = s.partes.filter(p => p.v > 0).map(p =>
    `<span style="color:${COR_FRENTE[p.chave] || '#6B7280'}">●</span> ${esc(p.nome)} <b>${fmt(p.v)}</b>`
  ).join(' &nbsp;·&nbsp; ') || 'nada registrado no mês';
  return `<div class="graf-total">
      <div class="gt-rot">${esc(rotulo)}</div>
      <div class="gt-val">${fmt(s.tot)}</div>
      <div class="gt-sub">${quebra}</div>
    </div>`;
}

function caixaJacare(d){
  const j = d.jacare || [];
  let iUlt = -1;
  for (let i = 0; i < j.length; i++) if (j[i].real_mtd != null) iUlt = i;
  const real     = iUlt >= 0 ? Number(j[iUlt].real_mtd || 0) : 0;
  const bruto    = iUlt >= 0 ? Number(j[iUlt].bruto_mtd || 0) : 0;
  const metaHoje = iUlt >= 0 ? Number(j[iUlt].meta_mtd || 0) : 0;
  const metaMes  = Number(d.periodo.meta_mes || 0);
  const gap      = real - metaHoje;
  const gapBr    = bruto - metaHoje;
  const pctMes   = metaMes  ? (real / metaMes)  * 100 : null;   // atingimento da meta cheia

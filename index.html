  const pctMtd   = metaHoje ? (real / metaHoje) * 100 : null;   // atingimento do ritmo (MTD)
  // o mesmo ritmo, medido sem multiplicador: é a venda que de fato entrou no caixa
  const pctMtdBr = metaHoje ? (bruto / metaHoje) * 100 : null;
  const pctMesBr = metaMes  ? (bruto / metaMes)  * 100 : null;
  const cls      = gap   >= 0 ? 'gt-pos' : 'gt-neg';
  const clsBr    = gapBr >= 0 ? 'gt-pos' : 'gt-neg';
  const sinal    = gap   >= 0 ? '+' : '−';
  const sinalBr  = gapBr >= 0 ? '+' : '−';
  return `<div class="graf-total">
      <div class="gt-cols">
        <div class="gt-col">
          <div class="gt-rot">Realizado MTD <span class="gt-pct">c/ multi</span></div>
          <div class="gt-val">${R(real)}</div>
        </div>
        <div class="gt-col">
          <div class="gt-rot">Bruto MTD</div>
          <div class="gt-val">${R(bruto)}</div>
        </div>
        <div class="gt-col">
          <div class="gt-rot">Meta MTD</div>
          <div class="gt-val">${R(metaHoje)}</div>
        </div>
        <div class="gt-col">
          <div class="gt-rot">Ating. MTD <span class="gt-pct">c/ multi</span></div>
          <div class="gt-val ${cls}">${P(pctMtd)}</div>
        </div>
        <div class="gt-col">
          <div class="gt-rot">Ating. MTD <span class="gt-pct">bruto</span></div>
          <div class="gt-val ${clsBr}">${P(pctMtdBr)}</div>
        </div>
      </div>
      <div class="gt-sub">vs. ritmo de hoje:
        <span class="${cls}">${sinal}${R(Math.abs(gap))}</span> c/ multi ·
        <span class="${clsBr}">${sinalBr}${R(Math.abs(gapBr))}</span> bruto
        &nbsp;·&nbsp; meta do mês ${R(metaMes)} (<b>${P(pctMes)}</b> c/ multi,
        ${P(pctMesBr)} bruto)</div>
    </div>`;
}

function baseEmpilhado(rotulos, series, opts){
  return {
    type: 'bar',
    data: { labels: rotulos.map(diaCurto), datasets: series },
    options: {
      responsive: true, maintainAspectRatio: false,
      layout: { padding: { top: 42 } },   // espaço para a janelinha de total
      interaction: { mode: 'index', intersect: false },
      scales: {
        x: { stacked: true, grid: { display: false },
             ticks: { color: '#6B7280', font: { size: 9 }, maxRotation: 0, autoSkip: false } },
        y: { stacked: true, beginAtZero: true,
             grid: { color: 'rgba(0,0,0,.05)' },
             ticks: { color: '#6B7280', font: { size: 10 }, callback: opts.tickY } }
      },
      plugins: {
        legend: { position: 'top', align: 'end',
          labels: { boxWidth: 12, boxHeight: 12, font: { size: 11, weight: '600' },
                    color: '#374151', usePointStyle: true, pointStyle: 'rect' } },
        tooltip: { backgroundColor: '#1A1A2E', padding: 11, cornerRadius: 6,
          titleFont: { size: 12 }, bodyFont: { size: 11.5 }, footerFont: { size: 11, weight: '400' },
          bodySpacing: 3, footerMarginTop: 8, footerColor: '#C9CBD6', boxPadding: 3,
          filter: item => item.parsed.y > 0,
          callbacks: {
            label: c => ' ' + c.dataset.label + ': ' + opts.fmt(c.parsed.y),
            footer: items => opts.detalhe ? opts.detalhe(items[0].dataIndex) : ''
          } },
        datalabels: {
          color: '#fff', font: { size: 9, weight: '700' },
          formatter: v => v > 0 ? opts.rotulo(v) : '',
          display: ctx => ctx.dataset.data[ctx.dataIndex] > 0
        }
      }
    },
    plugins: [ChartDataLabels]
  };
}

// ── HOVER DAS LINHAS DE PRODUTO ───────────────────────────────
// A pergunta é "as 10 vendas de Advisor saíram todas pelo mesmo valor?". O ticket
// médio não responde isso — esconde justamente a dispersão. Então o hover mostra
// os negócios um a um. É flutuante e sem clique de propósito: passou o mouse, viu,
// tirou. Nada de painel fixo empurrando a página.
let dadosGraficos = null;

function caixaTip(){
  let el = document.getElementById('tip-prod');
  if (!el) {
    el = document.createElement('div');
    el.id = 'tip-prod';
    el.className = 'tip-prod';
    (document.body || document.documentElement).appendChild(el);
  }
  return el;
}

function moveTip(ev){
  const el = document.getElementById('tip-prod');
  if (!el || el.hidden) return;
  const margem = 14;
  const lg = el.offsetWidth || 320, al = el.offsetHeight || 180;
  const maxX = (window.innerWidth || 1200) - lg - 8;
  const maxY = (window.innerHeight || 800) - al - 8;
  // vira para o outro lado do cursor quando não cabe — senão o tooltip some na borda
  let x = ev.clientX + margem, y = ev.clientY + margem;
  if (x > maxX) x = Math.max(8, ev.clientX - lg - margem);
  if (y > maxY) y = Math.max(8, ev.clientY - al - margem);
  el.style.left = x + 'px';
  el.style.top  = y + 'px';
}

function escondeTip(){
  const el = document.getElementById('tip-prod');
  if (el) { el.hidden = true; el.innerHTML = ''; }
}

function tipProduto(ev, frente, idx){
  const t = ((dadosGraficos || {}).produtos || {})[frente];
  const l = t && (t.linhas || [])[idx];
  if (!l) return;
  const itens = l.itens || [];
  const MAX = 14;
  const linhas = itens.slice(0, MAX).map(i => `
    <tr>
      <td class="tp-dia">${fmtDia(i.dia)}</td>
      <td class="tp-id">#${i.id}</td>
      <td class="tp-tit">${esc(i.titulo)}</td>
      <td class="tp-dono">${esc(i.dono)}</td>
      <td class="tp-val">${R(i.bruto)}${i.sem_multi ? ' <span class="tp-flag">⚠</span>' : ''}</td>
    </tr>`).join('');

  const el = caixaTip();
  el.innerHTML = `
    <div class="tp-head">${esc(l.produto)}
      <span class="tp-sub">${N(l.volume)} venda(s) · ${R(l.valor)} bruto</span></div>
    <table class="tp-tab"><tbody>${linhas}</tbody></table>
    ${itens.length > MAX ? `<div class="tp-mais">… e mais ${N(itens.length - MAX)} venda(s)</div>` : ''}
    <div class="tp-pe">${
      l.volume <= 1 ? 'Venda única.'
      : l.preco_unico
        ? `Todas as ${N(l.volume)} saíram por <b>${R(l.bruto_max)}</b>.`
        : `Preço <b>varia</b>: de ${R(l.bruto_min)} a ${R(l.bruto_max)} · ticket médio ${R(l.ticket)}${
            l.ticket_qtd !== l.ticket_base ? ` (de ${N(l.ticket_qtd)} venda(s) ≥ ${R(TICKET_MIN)})` : ''}.`}${
      itens.some(i => i.sem_multi) ? ' <span class="tp-flag">⚠</span> = sem multiplicador.' : ''}</div>`;
  el.hidden = false;
  moveTip(ev);
}

function renderGraficos(d){
  destroiCharts();
  dadosGraficos = d;
  const tmin = ((d.produtos || {}).navigator || {}).ticket_min;
  if (tmin != null) TICKET_MIN = tmin;
  escondeTip();
  const fr = d.frentes;
  const alertas = (d.alertas || []).map(a => `<div class="alerta">⚠ ${esc(a)}</div>`).join('');

  // O card mostra o valor COM multiplicador, que é o que bate contra a meta. Quando
  // alguma venda está sem o campo preenchido ela entra como zero, e o card fica menor
  // que o bruto sem explicação — foi assim que "2 vendas de 990" virou "R$ 990".
  const cardsAting = d.atingimento.map(a => {
    const sm = a.sem_multi || {};
    const difere = a.bruto != null && Math.abs(a.bruto - a.multi) > 1;
    return `
    <div class="kcard">
      <div class="rot">${esc(a.nome)}</div>
      <div class="val">${a.pct == null ? '—' : P(a.pct)}</div>
      <div class="sub">${R(a.multi)} de ${R(a.meta)}${
        difere ? ` <span class="hint">· bruto ${R(a.bruto)}</span>` : ''}<br>
        ${N(a.vendas)} venda(s) · ${N(a.reunioes)} reunião(ões) validada(s)<br>
        conversão ${P(a.conversao)} <span class="hint">${N(a.deals_ganhos)} de ${N(a.deals_com_reuniao)} negócio(s)</span>${
        sm.qtd ? `<div class="aviso-multi" title="${esc((sm.itens || [])
            .map(i => `${i.titulo} — ${R(i.valor)}`).join(' · '))}">⚠ ${N(sm.qtd)} venda(s)
            sem multiplicador · ${R(sm.bruto)} fora da conta</div>` : ''}</div>
    </div>`;
  }).join('');

  const cm = d.conversao_mes || {};

  // ── produtos vendidos: uma tabela por frente ──
  const pr = d.produtos || {};
  const tabelaProduto = k => {
    const t = pr[k];
    if (!t) return '';
    const corpo = t.linhas.length
      ? t.linhas.map((l, i) => `
          <tr class="linha-prod" onmouseenter="tipProduto(event,'${k}',${i})"
              onmousemove="moveTip(event)" onmouseleave="escondeTip()">
            <td class="mot">${esc(l.produto)}${
              l.volume > 1 && l.preco_unico === false
                ? '<span class="pt-varia" title="as vendas saíram por preços diferentes">~</span>' : ''}</td>
            <td class="num">${R(l.valor)}</td>
            <td class="num">${N(l.volume)}</td>
            <td class="num">${tkCel(l.ticket, l.ticket_qtd, l.ticket_base)}</td>
          </tr>`).join('') +
        `<tr class="total">
            <td class="mot">TOTAL</td>
            <td class="num">${R(t.total_valor)}</td>
            <td class="num">${N(t.total_volume)}</td>
            <td class="num">${tkCel(t.ticket_geral, t.ticket_geral_qtd, t.ticket_geral_base)}</td>
         </tr>`
      : `<tr><td colspan="4" class="perda-vazio">Nenhuma venda nesta frente no mês.</td></tr>`;
    return `
      <div class="perda-card">
        <div class="perda-tit"><span class="pt-dot" style="background:${COR_FRENTE[k]}"></span>
          ${esc(t.nome)}<span class="pt-qtd">${R(t.total_valor)} · ${N(t.total_volume)} venda(s)</span></div>
        <table class="perda">
          <thead><tr>
            <th>Produto</th><th class="num">Valor</th><th class="num">Vol.</th><th class="num">Ticket</th>
          </tr></thead>
          <tbody>${corpo}</tbody>
        </table>
      </div>`;
  };
  const tabelasProduto = `
    <div class="block-title">Produtos vendidos por frente<div class="rule"></div>
      <span class="peso-nota">valor bruto · ticket = média das vendas ≥ ${R(TICKET_MIN)} ·
        passe o mouse na linha para ver as vendas uma a uma · <b>~</b> = preço variou</span>
    </div>
    <div class="perda-grid">${fr.map(f => tabelaProduto(f.chave)).join('')}</div>`;

  // ── motivos de perda: uma tabela por frente, top 10 ──
  const mp = d.motivos_perda || {};
  const tabelaPerda = k => {
    const t = mp[k];
    if (!t) return '';
    const corpo = t.linhas.length
      ? t.linhas.map((l, i) => `
          <tr>
            <td class="pos-n">${i + 1}</td>
            <td class="mot">${esc(l.motivo)}</td>
            <td class="num">${N(l.volume)}</td>
            <td class="num">${P(l.rep)}</td>
          </tr>`).join('') +
        (t.outros ? `
          <tr class="outros">
            <td></td>
            <td class="mot">outros ${N(t.outros.motivos)} motivo(s)</td>
            <td class="num">${N(t.outros.volume)}</td>
            <td class="num">${P(t.outros.rep)}</td>
          </tr>` : '') +
        `<tr class="total">
            <td></td><td class="mot">TOTAL</td>
            <td class="num">${N(t.total)}</td><td class="num">100,0%</td>
         </tr>`
      : `<tr><td colspan="4" class="perda-vazio">Nenhum perdido nesta frente no mês.</td></tr>`;
    return `
      <div class="perda-card">
        <div class="perda-tit"><span class="pt-dot" style="background:${COR_FRENTE[k]}"></span>
          ${esc(t.nome)}<span class="pt-qtd">${N(t.total)} perdido(s)</span></div>
        <table class="perda">
          <thead><tr>
            <th></th><th>Motivo</th><th class="num">Volume</th><th class="num">Rep.</th>
          </tr></thead>
          <tbody>${corpo}</tbody>
        </table>
      </div>`;
  };
  const totPerd = fr.reduce((a, f) => a + ((mp[f.chave] || {}).total || 0), 0);
  const tabelasPerda = `
    <div class="block-title">Motivos de perda — top 10 por frente<div class="rule"></div>
      <span class="peso-nota">${N(totPerd)} perdido(s) no mês · Rep. = fatia dentro da própria frente</span>
    </div>
    <div class="perda-grid">${fr.map(f => tabelaPerda(f.chave)).join('')}</div>`;

  document.getElementById('conteudo-graficos').innerHTML = `
    <div class="block-title">Atingimento por frente<div class="rule"></div></div>
    <div class="cards">${cardsAting}</div>
    <div class="nota-comp">Conversão consolidada: <b>${P(cm.taxa)}</b> —
      ${N(cm.deals_ganhos || 0)} negócio(s) Ganho de ${N(cm.deals_com_reuniao || 0)} com reunião validada no mês.</div>

    <div class="graf">
      <div class="graf-tit">Reuniões validadas por dia</div>
      <div class="graf-sub">O subconjunto que passou na régua de validação ·
        passe o mouse na barra para ver os negócios</div>
      <div class="graf-box"><canvas id="g-reunioes"></canvas>
        ${caixaTotal('Validadas no mês', d.reunioes, fr, v => N(v))}</div>
    </div>

    <div class="graf">
      <div class="graf-tit">Vendas por dia</div>
      <div class="graf-sub">Valor bruto das vendas, empilhado por frente</div>
      <div class="graf-box"><canvas id="g-vendas"></canvas>
        ${caixaTotal('Vendas brutas no mês', d.vendas, fr, v => R(v))}</div>
    </div>

    ${tabelasProduto}

    <div class="graf">
      <div class="graf-tit">Meta x Realizado acumulado</div>
      <div class="graf-sub">Meta de ${R(d.periodo.meta_mes)} distribuída pelos ${N(d.periodo.du_total)} dias úteis,
        contra o realizado acumulado — linha cheia é o <b>bruto</b>, pontilhada é o valor
        <b>com multiplicador</b> (é essa que bate contra a meta)</div>
      <div class="graf-box alto"><canvas id="g-jacare"></canvas>
        ${caixaJacare(d)}</div>
    </div>

    <div class="graf">
      <div class="graf-tit">Perdidos por dia</div>
      <div class="graf-sub">Negócios marcados como perdidos, empilhado por frente ·
        filtro ${N(d.filtro_perdidos)} do Pipedrive</div>
      <div class="graf-box"><canvas id="g-perdidos"></canvas>
        ${caixaTotal('Perdidos no mês', d.perdidos, fr, v => N(v))}</div>
    </div>
    ${tabelasPerda}
    ${alertas}
    <div class="rodape">Atualizado em ${d.periodo.atualizado_em}</div>`;

  if (typeof Chart === 'undefined') {
    document.getElementById('conteudo-graficos').insertAdjacentHTML('afterbegin',
      '<div class="alerta">⚠ Não consegui carregar a biblioteca de gráficos (Chart.js). Verifique a conexão.</div>');
    return;
  }

  // 1 — reuniões validadas
  CHARTS.reu = new Chart(document.getElementById('g-reunioes'), baseEmpilhado(
    d.dias,
    fr.map(f => ({ label: f.nome, data: d.reunioes[f.chave],
                   backgroundColor: COR_FRENTE[f.chave], borderWidth: 0,
                   borderRadius: 2, maxBarThickness: 30 })),
    { fmt: v => N(v), rotulo: v => N(v), tickY: v => N(v),
      detalhe: i => detalheDoDia(d, i, true) }
  ));

  // 2 — vendas brutas
  CHARTS.ven = new Chart(document.getElementById('g-vendas'), baseEmpilhado(
    d.dias,
    fr.map(f => ({ label: f.nome, data: d.vendas[f.chave],
                   backgroundColor: COR_FRENTE[f.chave], borderWidth: 0,
                   borderRadius: 2, maxBarThickness: 30 })),
    { fmt: v => R(v), rotulo: v => kCurto(v), tickY: v => kBRL(v) }
  ));

  // 3 — jacaré
  CHARTS.jac = new Chart(document.getElementById('g-jacare'), {
    type: 'line',
    data: {
      labels: d.jacare.map(j => diaCurto(j.dia)),
      datasets: [
        { label: 'Meta acumulada', data: d.jacare.map(j => j.meta_mtd),
          borderColor: '#B8860B', borderWidth: 2, borderDash: [5,4],
          pointRadius: 0, pointHoverRadius: 5, tension: 0, fill: false, order: 3 },
        { label: 'Realizado bruto', data: d.jacare.map(j => j.bruto_mtd),
          borderColor: '#8A8FA3', borderWidth: 1.8, pointRadius: 0, pointHoverRadius: 5,
          tension: 0.15, spanGaps: false, fill: false, order: 2 },
        { label: 'Realizado c/ multiplicador', data: d.jacare.map(j => j.real_mtd),
          borderColor: '#1A1A2E', borderWidth: 2.5, borderDash: [6,3],
          pointRadius: 0, pointHoverRadius: 6,
          tension: 0.15, spanGaps: false, order: 1,
          fill: { target: 0, above: 'rgba(13,122,62,.10)', below: 'rgba(160,160,170,.14)' } }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      layout: { padding: { top: 42 } },   // espaço para a janelinha de total
      interaction: { mode: 'index', intersect: false },
      scales: {
        x: { grid: { display: false },
             ticks: { color: '#6B7280', font: { size: 9 }, maxRotation: 0, autoSkip: true, maxTicksLimit: 16 } },
        y: { beginAtZero: true, grid: { color: 'rgba(0,0,0,.05)' },
             ticks: { color: '#6B7280', font: { size: 10 }, callback: v => kBRL(v) } }
      },
      plugins: {
        datalabels: { display: false },
        legend: { position: 'top', align: 'end',
          labels: { boxWidth: 20, boxHeight: 2, font: { size: 11, weight: '600' },
                    color: '#374151', usePointStyle: true, pointStyle: 'line' } },
        tooltip: { backgroundColor: '#1A1A2E', padding: 12, cornerRadius: 6,
          callbacks: {
            label: c => ' ' + c.dataset.label + ': ' + (c.parsed.y == null ? '—' : R(c.parsed.y)),
            footer: items => {
              const meta = items.find(i => i.datasetIndex === 0);
              const real = items.find(i => i.datasetIndex === 2);   // c/ multiplicador
              if (!meta || !real || real.parsed.y == null || !meta.parsed.y) return '';
              const g = real.parsed.y - meta.parsed.y;
              return (g >= 0 ? 'Acima da meta em ' : 'Abaixo da meta em ') + R(Math.abs(g));
            }
          } }
      }
    },
    plugins: [ChartDataLabels]
  });

  // 4 — perdidos por dia
  CHARTS.perd = new Chart(document.getElementById('g-perdidos'), baseEmpilhado(
    d.dias,
    fr.map(f => ({ label: f.nome, data: d.perdidos[f.chave],
                   backgroundColor: COR_PERDA[f.chave], borderWidth: 0,
                   borderRadius: 2, maxBarThickness: 30 })),
    { fmt: v => N(v), rotulo: v => N(v), tickY: v => N(v) }
  ));
}

async function carregarGraficos(){
  document.getElementById('conteudo-graficos').innerHTML =
    '<div class="card"><div class="loading"><div class="spinner"></div>Carregando gráficos…</div></div>';
  try {
    const q = new URLSearchParams({fmt:'graficos',
      mes: document.getElementById('sel-mes').value,
      ano: document.getElementById('sel-ano').value});
    if (KEY) q.set('k', KEY);
    const data = await (await fetch('/api/index?' + q)).json();
    if (data.erro) throw new Error(data.erro);
    renderGraficos(data);
    graficosCarregados = true;
  } catch(e) {
    document.getElementById('conteudo-graficos').innerHTML =
      `<div class="card"><div class="erro">Erro: ${esc(e.message)}</div></div>`;
  }
}

// ── ABAS ──────────────────────────────────────────────────────
const ABAS = ['mes','graficos','forecast'];
let graficosCarregados = false, forecastCarregado = false;

// Atualiza as QUATRO abas de uma vez. É o que o botão Atualizar faz, e é o que
// roda ao trocar o período. Não existe atualização automática por tempo.
let atualizando = false, iniciado = false;
async function atualizarTudo(){
  if (atualizando) return;
  atualizando = true;
  const btn = document.getElementById('btn-reload');
  const rot = btn ? btn.textContent : '';
  if (btn) { btn.textContent = 'Atualizando…'; btn.disabled = true; }
  try {
    await Promise.all([carregar(), carregarGraficos(), carregarForecast()]);
  } finally {
    if (btn) { btn.textContent = rot || 'Atualizar'; btn.disabled = false; }
    atualizando = false;
  }
}

function trocouPeriodo(){ atualizarTudo(); }

function setView(v){
  ABAS.forEach(k => {
    document.getElementById('view-' + k).classList.toggle('on', k === v);
    document.getElementById('tab-' + k).classList.toggle('on', k === v);
  });
  location.hash = v === 'mes' ? '' : '#' + v;
  // rede de segurança: se a carga dessa aba falhou, tenta de novo ao abrir.
  // Durante o boot/refresh geral não faz nada — atualizarTudo() já está buscando.
  if (!iniciado || atualizando) return;
  if (v === 'graficos' && !graficosCarregados) carregarGraficos();
  if (v === 'forecast' && !forecastCarregado)  carregarForecast();
}

// ── FORECAST DIA A DIA ────────────────────────────────────────
let dadosForecast = null;

// ── lista de negócios, com ordenação por clique no cabeçalho ──
// Cada tabela renderizada ganha um id e guarda os próprios itens aqui, para
// reordenar sem ir buscar nada de novo no servidor.
let LISTAS = {}, LISTA_SEQ = 0;

const COLS_LISTA = [
  { campo: 'titulo',        rot: 'Negócio',   num: false },
  { campo: 'dono',          rot: 'Dono',      num: false },
  { campo: 'frente',        rot: 'Frente',    num: false },
  { campo: 'probabilidade', rot: 'Prob.',     num: true  },
  { campo: 'valor',         rot: 'Valor',     num: true  },
  { campo: 'ponderado',     rot: 'Ponderado', num: true  },
];

function ordenaItens(itens, campo, dir){
  const col = COLS_LISTA.find(c => c.campo === campo) || COLS_LISTA[3];
  const sinal = dir === 'asc' ? 1 : -1;
  const vazio = v => v == null || v === '';
  return itens.slice().sort((a, b) => {
    const x = a[campo], y = b[campo];
    // sem valor preenchido vai sempre para o fim, nas duas direções
    if (vazio(x) && vazio(y)) return (b.ponderado || 0) - (a.ponderado || 0);
    if (vazio(x)) return 1;
    if (vazio(y)) return -1;
    const c = col.num ? Number(x) - Number(y)
                      : String(x).localeCompare(String(y), 'pt-BR');
    if (c) return c * sinal;
    return (b.ponderado || 0) - (a.ponderado || 0);   // desempate
  });
}

function corpoLista(id){
  const st = LISTAS[id];
  if (!st) return '';
  return ordenaItens(st.itens, st.campo, st.dir).map(i => `
    <tr>
      <td class="tit"><a href="${i.url}" target="_blank" rel="noopener">${esc(i.titulo)} ↗</a></td>
      <td>${esc(i.dono)}</td>
      <td><span class="fr fr-${i.frente}">${esc(CURTO_FRENTE[i.frente] || i.frente)}</span></td>
      <td class="num">${i.probabilidade == null
          ? '<span class="falta">sem prob.</span>' : i.probabilidade + '%'}</td>
      <td class="num">${R(i.valor)}</td>
      <td class="num"><b>${i.ponderado ? R(i.ponderado) : '<span class="zero">—</span>'}</b></td>
    </tr>`).join('');
}

function cabecalhoLista(id){
  const st = LISTAS[id];
  return COLS_LISTA.map(c => {
    const ativo = st.campo === c.campo;
    const seta = ativo ? (st.dir === 'asc' ? '▲' : '▼') : '⇅';
    return `<th class="ord${c.num ? ' num' : ''}${ativo ? ' ativo' : ''}"
        onclick="ordenarLista('${id}','${c.campo}')"
        title="ordenar por ${c.rot}">${c.rot}<span class="seta">${seta}</span></th>`;
  }).join('');
}

function ordenarLista(id, campo){
  const st = LISTAS[id];
  if (!st) return;
  if (st.campo === campo) {
    st.dir = st.dir === 'asc' ? 'desc' : 'asc';
  } else {
    st.campo = campo;
    // texto começa A→Z; número começa do maior para o menor
    st.dir = (COLS_LISTA.find(c => c.campo === campo) || {}).num ? 'desc' : 'asc';
  }
  const t = document.getElementById(id);
  if (!t) return;
  t.querySelector('thead tr').innerHTML = cabecalhoLista(id);
  t.querySelector('tbody').innerHTML = corpoLista(id);
}

function listaNegocios(itens, vazio){
  if (!itens || !itens.length) return `<div class="fc-vazio">${vazio}</div>`;
  const id = 'lst' + (++LISTA_SEQ);
  LISTAS[id] = { itens, campo: 'probabilidade', dir: 'desc' };
  return `
    <table class="fc-det" id="${id}">
      <thead><tr>${cabecalhoLista(id)}</tr></thead>
      <tbody>${corpoLista(id)}</tbody>
    </table>`;
}

function toggleDia(i){
  const tr  = document.getElementById('fc-det-' + i);
  const bt  = document.getElementById('fc-bt-' + i);
  if (!tr) return;
  const abrir = tr.hidden;
  tr.hidden = !abrir;
  if (bt) { bt.textContent = abrir ? '▼' : '▶'; bt.classList.toggle('aberto', abrir); }
  if (abrir && !tr.dataset.pronto) {
    tr.querySelector('td').innerHTML =
      listaNegocios((dadosForecast.linhas[i] || {}).itens, 'Nenhum negócio previsto para este dia.');
    tr.dataset.pronto = '1';
  }
}

function renderForecast(d){
  dadosForecast = d;
  LISTAS = {};              // some com as tabelas do render anterior
  const p = d.periodo, t = d.total;
  const alertas = (d.alertas || []).map(a => `<div class="alerta">⚠ ${esc(a)}</div>`).join('');
  const clsProj = (t.pct_projecao != null && t.pct_projecao >= 100) ? 'pos' : 'neg';

  const cards = `
    <div class="cards">
      <div class="kcard"><div class="rot">Realizado no mês</div>
        <div class="val">${R(t.real_multi)}</div>
        <div class="sub">c/ multiplicador · bruto ${R(t.real_bruto)}</div></div>
      <div class="kcard hoje"><div class="rot">Previsto que falta</div>
        <div class="val">${R(t.previsto_restante)}</div>
        <div class="sub">ponderado de ${R(t.aberto_restante)} em aberto de hoje em diante</div></div>
      <div class="kcard"><div class="rot">Projeção do mês</div>
        <div class="val">${R(t.projecao)}</div>
        <div class="sub">realizado + previsto ponderado</div></div>
      <div class="kcard"><div class="rot">Projeção x Meta</div>
        <div class="val">${P(t.pct_projecao)}</div>
        <div class="sub">meta ${R(t.meta_mes)} · <span class="${clsProj}">${
          t.gap_projecao > 0 ? 'faltam ' + R(t.gap_projecao) : 'sobra ' + R(Math.abs(t.gap_projecao))}</span></div></div>
    </div>`;

  // ── faixa do range: consolidados de um período escolhido à mão ──
  const dias = d.linhas.map(l => l.dia);
  const ini0 = FC_RANGE.ini && dias.includes(FC_RANGE.ini) ? FC_RANGE.ini : dias[0];
  const fim0 = FC_RANGE.fim && dias.includes(FC_RANGE.fim) ? FC_RANGE.fim : dias[dias.length - 1];
  FC_RANGE = { ini: ini0, fim: fim0 };

  const faixaRange = `
    <div class="block-title">Consolidado do período<div class="rule"></div></div>
    <div class="fc-range">
      <label>De <input type="date" id="fc-de" value="${ini0}" min="${dias[0]}" max="${dias[dias.length-1]}"
             onchange="mudouRange()"></label>
      <label>até <input type="date" id="fc-ate" value="${fim0}" min="${dias[0]}" max="${dias[dias.length-1]}"
             onchange="mudouRange()"></label>
      <button class="fc-bt-range" onclick="rangeAtalho('resto')">De hoje até o fim</button>
      <button class="fc-bt-range" onclick="rangeAtalho('semana')">Próximos 7 dias</button>
      <button class="fc-bt-range" onclick="rangeAtalho('mes')">Mês todo</button>
    </div>
    <div id="fc-cards-range"></div>`;

  const linhas = d.linhas.map((l, i) => {
    const vazio = l.qtd === 0 && l.ganho_qtd === 0;
    const cls = [l.hoje ? 'e-hoje' : '', l.passado ? 'passado' : '',
                 !l.e_du ? 'fds' : '', vazio ? 'vazia' : ''].filter(Boolean).join(' ');
    return `
      <tr class="${cls}">
        <td class="dia">
          <button class="fc-bt" id="fc-bt-${i}" onclick="toggleDia(${i})"
                  ${l.qtd ? '' : 'disabled'}>▶</button>
          ${fmtDia(l.dia)}${l.hoje ? ' <span class="hoje-tag">hoje</span>' : ''}
          ${l.e_du ? '' : ' <span class="hint">n/ útil</span>'}
        </td>
        <td class="num">${l.qtd ? N(l.qtd) : '<span class="zero">—</span>'}</td>
        <td class="num">${l.p70 ? R(l.p70) : '<span class="zero">—</span>'}</td>
        <td class="num">${l.p50 ? R(l.p50) : '<span class="zero">—</span>'}</td>
        <td class="num">${l.p20 ? R(l.p20) : '<span class="zero">—</span>'}</td>
        <td class="num">${l.em_aberto ? R(l.em_aberto) : '<span class="zero">—</span>'}</td>
        <td class="num prev"><b>${l.previsto ? R(l.previsto) : '<span class="zero">—</span>'}</b></td>
        <td class="num real">${l.ganho_multi
            ? `${R(l.ganho_multi)} <span class="hint">${N(l.ganho_qtd)} venda(s)</span>`
            : '<span class="zero">—</span>'}</td>
      </tr>
      <tr class="fc-det-linha" id="fc-det-${i}" hidden><td colspan="8"></td></tr>`;
  }).join('');

  const totReal = d.linhas.reduce((a,l) => a + l.ganho_multi, 0);
  const totPrev = d.linhas.reduce((a,l) => a + l.previsto, 0);
  const totAb   = d.linhas.reduce((a,l) => a + l.em_aberto, 0);
  const totQtd  = d.linhas.reduce((a,l) => a + l.qtd, 0);

  const semData = d.sem_data.qtd ? `
    <div class="block-title">Sem data prevista — ficam fora do forecast<div class="rule"></div></div>
    <div class="card">
      <div class="fc-aviso">${N(d.sem_data.qtd)} negócio(s) · ${R(d.sem_data.valor)} em aberto
        sem data de fechamento. Enquanto a data não entrar no Pipedrive, esse valor não
        aparece em nenhum dia da tabela acima.</div>
      ${listaNegocios(d.sem_data.itens, '')}
    </div>` : '';

  const foraMes = d.fora_do_mes.qtd ? `
    <div class="block-title">Previstos para fora deste mês<div class="rule"></div></div>
    <div class="card">
      <div class="fc-aviso">${N(d.fora_do_mes.qtd)} negócio(s) · ${R(d.fora_do_mes.valor)}
        (ponderado ${R(d.fora_do_mes.previsto)}) com data prevista fora de
        ${MESES[p.mes-1]}/${p.ano}.</div>
      ${listaNegocios(d.fora_do_mes.itens, '')}
    </div>` : '';

  document.getElementById('conteudo-forecast').innerHTML = `
    ${cards}
    ${faixaRange}
    <div class="block-title">Forecast dia a dia — ${MESES[p.mes-1]} ${p.ano}<div class="rule"></div></div>
    <div class="card">
      <div class="table-scroll">
        <table class="fc">
          <thead><tr>
            <th>Dia</th><th class="num">Negócios</th>
            <th class="num">70%</th><th class="num">50%</th><th class="num">20%</th>
            <th class="num">Em aberto</th><th class="num">Previsto</th><th class="num">Entrou</th>
          </tr></thead>
          <tbody>
            ${linhas}
            <tr class="total">
              <td>TOTAL</td><td class="num">${N(totQtd)}</td>
              <td class="num" colspan="3">—</td>
              <td class="num">${R(totAb)}</td>
              <td class="num">${R(totPrev)}</td>
              <td class="num">${R(totReal)}</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="fc-nota">
        Clique na setinha de um dia para ver os negócios por trás dele — o título leva
        direto para o negócio no Pipedrive.
        <b>Previsto</b> = 70% × 0,7 + 50% × 0,5 + 20% × 0,2, pela data prevista de fechamento.
        <b>Entrou</b> = o que de fato foi ganho naquele dia, com multiplicador.
        ${p.etapa ? `Só entram negócios na etapa <b>${esc(p.etapa)}</b>.` : ''}
      </div>
    </div>
    ${semData}${foraMes}${alertas}
    <div class="rodape">Atualizado em ${p.atualizado_em}</div>`;

  renderCardsRange();
}

// ── consolidados do range ─────────────────────────────────────
// Tudo calculado no navegador a partir das linhas que já vieram: mudar o range
// não dispara chamada nenhuma ao Pipedrive.
let FC_RANGE = { ini: null, fim: null };

function mudouRange(){
  const de  = document.getElementById('fc-de');
  const ate = document.getElementById('fc-ate');
  if (!de || !ate) return;
  let a = de.value, b = ate.value;
  if (a && b && a > b) { const t = a; a = b; b = t; de.value = a; ate.value = b; }
  FC_RANGE = { ini: a, fim: b };
  renderCardsRange();
}

function rangeAtalho(qual){
  if (!dadosForecast) return;
  const dias = dadosForecast.linhas.map(l => l.dia);
  const hoje = dadosForecast.periodo.hoje;
  let a = dias[0], b = dias[dias.length - 1];
  if (qual === 'resto')  { a = dias.includes(hoje) ? hoje : dias[0]; }
  if (qual === 'semana') {
    a = dias.includes(hoje) ? hoje : dias[0];
    const i = dias.indexOf(a);
    b = dias[Math.min(i + 6, dias.length - 1)];
  }
  document.getElementById('fc-de').value  = a;
  document.getElementById('fc-ate').value = b;
  FC_RANGE = { ini: a, fim: b };
  renderCardsRange();
}

function renderCardsRange(){
  const box = document.getElementById('fc-cards-range');
  if (!box || !dadosForecast) return;
  const { ini, fim } = FC_RANGE;
  const sel = dadosForecast.linhas.filter(l => l.dia >= ini && l.dia <= fim);
  const soma = c => sel.reduce((a, l) => a + (l[c] || 0), 0);

  const previsto = soma('previsto'), aberto = soma('em_aberto');
  const p20 = soma('p20'), p50 = soma('p50'), p70 = soma('p70');
  const semProb = soma('sem_probabilidade');
  const entrou = soma('ganho_multi'), entrouQtd = soma('ganho_qtd');
  const qtd = soma('qtd');
  const du = sel.filter(l => l.e_du).length;

  box.innerHTML = `
    <div class="cards">
      <div class="kcard forte"><div class="rot">Previsto no período</div>
        <div class="val">${R(previsto)}</div>
        <div class="sub">ponderado de ${R(aberto)} em aberto · ${N(qtd)} negócio(s)</div></div>
      <div class="kcard futuro"><div class="rot">Ponderado por faixa</div>
        <div class="val">${R(previsto)}</div>
        <div class="sub">70% ${R(p70 * 0.7)} · 50% ${R(p50 * 0.5)} · 20% ${R(p20 * 0.2)}<br>
          de ${R(p70 + p50 + p20)} em aberto${
          semProb ? ` · ${R(semProb)} sem probabilidade (fora)` : ''}</div></div>
      <div class="kcard"><div class="rot">Entrou no período</div>
        <div class="val">${R(entrou)}</div>
        <div class="sub">c/ multiplicador · ${N(entrouQtd)} venda(s)</div></div>
      <div class="kcard"><div class="rot">Período</div>
        <div class="val">${N(sel.length)} dia(s)</div>
        <div class="sub">${fmtDia(ini)} a ${fmtDia(fim)} · ${N(du)} dia(s) útil(eis)</div></div>
    </div>`;
}

async function carregarForecast(){
  document.getElementById('conteudo-forecast').innerHTML =
    '<div class="card"><div class="loading"><div class="spinner"></div>Carregando forecast…</div></div>';
  try {
    const q = new URLSearchParams({fmt:'forecast',
      mes: document.getElementById('sel-mes').value,
      ano: document.getElementById('sel-ano').value});
    if (KEY) q.set('k', KEY);
    const data = await (await fetch('/api/index?' + q)).json();
    if (data.erro) throw new Error(data.erro);
    renderForecast(data);
    forecastCarregado = true;
  } catch(e) {
    document.getElementById('conteudo-forecast').innerHTML =
      `<div class="card"><div class="erro">Erro: ${esc(e.message)}</div></div>`;
  }
}

// ── bootstrap: carrega tudo uma vez ao abrir. Sem refresh automático. ──
const abaInicial = (location.hash || '').replace('#','');
if (ABAS.includes(abaInicial)) setView(abaInicial);
iniciado = true;
atualizarTudo();
</script>
